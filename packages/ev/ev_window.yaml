### EV stuff related to hours / window / cheapest window

## Input helpers

input_number:
  ev_window_charging_start_hour:
    name: "EV Window Charging Start Hour"
    unit_of_measurement: "h"
    min: 0
    max: 23
    step: 1
    icon: mdi:clock-start

  ev_window_charging_end_hour:
    name: "EV Window Charging End Hour"
    unit_of_measurement: "h"
    min: 0
    max: 23
    step: 1
    icon: mdi:clock-end

  ev_charging_limit_window:
    name: "EV Charging Limit Window"
    unit_of_measurement: "%"
    min: 50
    max: 100
    step: 10
    icon: mdi:clock-star-four-points

  ev_window_charging_max_price:
    name: "EV Window Charging Max Price"
    unit_of_measurement: "EUR/kWh"
    min: -0.50
    max: 2.00
    step: 0.01
    mode: box
    icon: mdi:currency-eur

input_boolean:
  ev_window_charging:
    name: "EV Window Charging"
    icon: mdi:clock

  ev_dynamic_tariff_optimization:
    name: "EV Dynamic Tariff Optimization (in window)"
    icon: mdi:chart-line

  ev_window_max_price_enabled:
    name: "EV Window Max Price Limit"
    icon: mdi:cash-lock

## Templates & sensors

template:
  - binary_sensor:
      - name: "EV Window Price Allowed"
        unique_id: ev_window_price_allowed
        state: >-
          {% if not is_state('input_boolean.ev_window_max_price_enabled', 'on') %}
            true
          {% else %}
            {% set max_p = states('input_number.ev_window_charging_max_price') | float(none) %}
            {% set cur_p = states('sensor.frank_energie_prices_current_electricity_price_all_in') | float(none) %}
            {% if cur_p is not none and max_p is not none %}
              {{ (cur_p <= max_p) | lower }}
            {% else %}
              false
            {% endif %}
          {% endif %}
        attributes:
          max_price: "{{ states('input_number.ev_window_charging_max_price') }}"
          max_price_enabled: "{{ states('input_boolean.ev_window_max_price_enabled') }}"
          current_price: "{{ states('sensor.frank_energie_prices_current_electricity_price_all_in') }}"

  - sensor:
      # 1) Base window start/end (purely from input_numbers + time)
      - name: EV Charging Window Start Time
        unique_id: ev_charging_window_start_time
        state: >
          {# Start time of the charging window in format YYYY-MM-DD HH:MM:SS #}
          {% set start_hour = states('input_number.ev_window_charging_start_hour') | int(0) %}
          {% set end_hour = states('input_number.ev_window_charging_end_hour') | int(0) %}
          {% set now_dt = now() %}
          {% set now_str = now_dt.strftime('%Y-%m-%d %H:%M:%S') %}

          {% set today = now_dt.strftime('%Y-%m-%d') %}
          {% set yesterday = (now_dt - timedelta(days=1)).strftime('%Y-%m-%d') %}
          {% set tomorrow = (now_dt + timedelta(days=1)).strftime('%Y-%m-%d') %}

          {% if end_hour <= start_hour %}
            {# Window crosses midnight #}
            {% set current_start = yesterday + ' ' + '%02d' | format(start_hour) + ':00:00' %}
            {% set current_end   = today     + ' ' + '%02d' | format(end_hour)   + ':00:00' %}
            {% set next_start    = today     + ' ' + '%02d' | format(start_hour) + ':00:00' %}
          {% else %}
            {# Window same day #}
            {% set current_start = today + ' ' + '%02d' | format(start_hour) + ':00:00' %}
            {% set current_end   = today + ' ' + '%02d' | format(end_hour)   + ':00:00' %}
            {% set next_start    = tomorrow + ' ' + '%02d' | format(start_hour) + ':00:00' %}
          {% endif %}

          {% if now_str < current_end %}
            {{ current_start }}
          {% else %}
            {{ next_start }}
          {% endif %}

      - name: EV Charging Window End Time
        unique_id: ev_charging_window_end_time
        state: >
          {# End time of the charging window in format YYYY-MM-DD HH:MM:SS #}
          {% set start_hour = states('input_number.ev_window_charging_start_hour') | int(0) %}
          {% set end_hour = states('input_number.ev_window_charging_end_hour') | int(0) %}
          {% set now_dt = now() %}
          {% set now_str = now_dt.strftime('%Y-%m-%d %H:%M:%S') %}

          {% set today = now_dt.strftime('%Y-%m-%d') %}
          {% set yesterday = (now_dt - timedelta(days=1)).strftime('%Y-%m-%d') %}
          {% set tomorrow = (now_dt + timedelta(days=1)).strftime('%Y-%m-%d') %}

          {% if end_hour <= start_hour %}
            {# Window crosses midnight #}
            {% set current_start = yesterday + ' ' + '%02d' | format(start_hour) + ':00:00' %}
            {% set current_end   = today     + ' ' + '%02d' | format(end_hour)   + ':00:00' %}
            {% set next_end      = tomorrow  + ' ' + '%02d' | format(end_hour)   + ':00:00' %}
          {% else %}
            {# Window same day #}
            {% set current_start = today + ' ' + '%02d' | format(start_hour) + ':00:00' %}
            {% set current_end   = today + ' ' + '%02d' | format(end_hour)   + ':00:00' %}
            {% set next_end      = tomorrow + ' ' + '%02d' | format(end_hour)   + ':00:00' %}
          {% endif %}

          {% if now_str < current_end %}
            {{ current_end }}
          {% else %}
            {{ next_end }}
          {% endif %}

      # 2) Is current time in active window?
      - name: EV Charging Window Active
        unique_id: ev_charging_window_active
        # device_class: problem
        state: >
          {% set window_start = states('sensor.ev_charging_window_start_time') %}
          {% set window_end = states('sensor.ev_charging_window_end_time') %}
          {% set now_str = now().strftime('%Y-%m-%d %H:%M:%S') %}

          {% if window_start in ['unknown','unavailable','None'] or
                window_end in ['unknown','unavailable','None'] %}
            false
          {% else %}
            {{ (now_str >= window_start and now_str < window_end) | lower }}
          {% endif %}

      # Calculate hours needed to EV charge (window)
      - name: "EV Hours Needed For Charging"
        unique_id: ev_hours_needed_for_charging
        unit_of_measurement: "h"
        icon: mdi:clock-fast
        state: >
          {% set current_battery = states('sensor.ev_battery_percentage') | float(0) %}
          {% set target_battery = states('input_number.ev_charging_limit_window') | float(0) %}
          {% set battery_capacity = states('sensor.ev_active_battery_capacity') | float(60) %}
          {% set charger_power = states('sensor.ev_active_max_charge_power') | float(11) %}
          {% set efficiency = states('input_number.ev_charging_efficiency_percent') | float(90) / 100 %}
          {% set battery_percentage_needed = target_battery - current_battery %}
          {% set kwh_needed = (battery_capacity * battery_percentage_needed / 100) %}
          {% set kwh_needed_with_losses = kwh_needed / efficiency %}
          {% set hours_needed = (kwh_needed_with_losses / charger_power) | round(1) %}
          {% if hours_needed > 0 %}
            {{ hours_needed }}
          {% else %}
            0.0
          {% endif %}
        attributes:
          active_vehicle: "{{ states('input_select.ev_active_vehicle') }}"
          current_battery_percent: "{{ states('sensor.ev_battery_percentage') | float(0) | round(1) }}"
          target_battery_percent: "{{ states('input_number.ev_charging_limit_window') | float(0) | round(1) }}"
          battery_capacity_kwh: "{{ states('sensor.ev_active_battery_capacity') | float(0) | round(1) }}"
          max_charge_power_kw: "{{ states('sensor.ev_active_max_charge_power') | float(0) | round(1) }}"
          
      # 3) Cheapest hours within window (JSON list)
      - name: EV Cheapest Hours In Window
        unique_id: ev_cheapest_hours_in_window
        state: >
          {# State is JSON string of selected hours #}
          {% set frank_prices = state_attr('sensor.frank_energie_prices_current_electricity_price_all_in', 'prices') %}
          {% set entsoe_prices = state_attr('sensor.average_electricity_price', 'prices') %}
          {% set raw_list = frank_prices if (frank_prices is not none and frank_prices | length > 0) else entsoe_prices %}
          {% set hours_needed = states('sensor.ev_hours_needed_for_charging') | float(0) %}
          {% set window_start = states('sensor.ev_charging_window_start_time') %}
          {% set window_end = states('sensor.ev_charging_window_end_time') %}
          {% set cutoff = now().strftime('%Y-%m-%d %H:00:00') %}

          {% if raw_list is none or raw_list | length == 0 or hours_needed == 0 or
                window_start in ['unknown','unavailable','None'] or
                window_end in ['unknown','unavailable','None'] %}
            []
          {% else %}
            {% set ns = namespace(items=[]) %}
            {% for item in raw_list %}
              {% set t_raw = item['from'] if 'from' in item else item.from if item.from is defined else item['time'] if 'time' in item else item.time if item.time is defined else none %}
              {% if t_raw is not none %}
                {% set dt = as_local(as_datetime(t_raw)) if as_datetime(t_raw) is not none else none %}
                {% set t_str = dt.strftime('%Y-%m-%d %H:%M:%S') if dt is not none else (t_raw | string).replace('T', ' ')[:19] %}
                {% set p_val = item['price'] if 'price' in item else item.price if item.price is defined else 0.0 %}
                {% set ns.items = ns.items + [{'time': t_str, 'price': p_val | float(0)}] %}
              {% endif %}
            {% endfor %}
            {% set window_prices = ns.items
                 | selectattr('time', '>=', window_start)
                 | selectattr('time', '<', window_end)
                 | list %}
            {% set future_prices = window_prices
                 | selectattr('time', '>=', cutoff)
                 | list %}

            {% if future_prices | length == 0 %}
              []
            {% else %}
              {% set sorted_prices = future_prices | sort(attribute='price') %}
              {% set hours_int = (hours_needed | int) + (1 if (hours_needed % 1) > 0 else 0) %}
              {% set selected = sorted_prices[:hours_int] | sort(attribute='time') %}
              [{% for item in selected -%}
                {"time": "{{ item.time }}", "price": {{ item.price | round(4) }}}
                {%- if not loop.last %},{% endif -%}
              {%- endfor %}]
            {% endif %}
          {% endif %}
        attributes:
          price_source: >-
            {% set frank_prices = state_attr('sensor.frank_energie_prices_current_electricity_price_all_in', 'prices') %}
            {% if frank_prices is not none and frank_prices | length > 0 %}
              Frank Energie
            {% else %}
              ENTSO-E
            {% endif %}
          count: >
            {% set s = states('sensor.ev_cheapest_hours_in_window') %}
            {% if s in ['unknown','unavailable','None',''] %}
              0
            {% else %}
              {% set list = s | from_json %}
              {{ list | length }}
            {% endif %}

      # 4) Latest start time (window_end - hours_needed)
      - name: EV Window Latest Start Time
        unique_id: ev_window_latest_start_time
        state: >
          {% set window_end = states('sensor.ev_charging_window_end_time') %}
          {% set hours_needed = states('sensor.ev_hours_needed_for_charging') | float(0) %}
          {% if window_end in ['unknown','unavailable','None'] or hours_needed == 0 %}
            unknown
          {% else %}
            {% set window_end_dt = strptime(window_end, '%Y-%m-%d %H:%M:%S') %}
            {% set latest_start_dt = window_end_dt - timedelta(hours=hours_needed) %}
            {{ latest_start_dt.strftime('%Y-%m-%d %H:%M:%S') }}
          {% endif %}

      # 5) Is current time in *any* of the cheapest hours?
      - name: EV Is In Cheapest Window
        unique_id: ev_is_in_cheapest_window
        state: >
          {% set s = states('sensor.ev_cheapest_hours_in_window') %}
          {% if s in ['unknown','unavailable','None',''] %}
            false
          {% else %}
            {% set cheapest = s | from_json %}
            {% set now_dt = now() %}
            {% set current_hour_prefix = now_dt.strftime('%Y-%m-%d %H') %}
            {% set match = cheapest | selectattr('time', 'match', '^' + current_hour_prefix) | list %}
            {{ (match | length > 0) | lower }}
          {% endif %}

      # 6) Sufficient time left in window (based on latest_start)
      - name: EV Sufficient Hours To Charge In Window
        unique_id: ev_sufficient_hours_to_charge_in_window
        state: >
          {% set latest_start = states('sensor.ev_window_latest_start_time') %}
          {% set now_str = now().strftime('%Y-%m-%d %H:%M:%S') %}
          {% if latest_start in ['unknown','unavailable','None'] %}
            false
          {% else %}
            {{ (now_str <= latest_start) | lower }}
          {% endif %}

      # 7) Sufficient known hours in window (based purely on available price slots)
      - name: EV Sufficient Known Hours In Window
        unique_id: ev_sufficient_known_hours_in_window
        state: >
          {% set window_start = states('sensor.ev_charging_window_start_time') %}
          {% set window_end = states('sensor.ev_charging_window_end_time') %}
          {% set hours_needed = states('sensor.ev_hours_needed_for_charging') | float(0) %}
          {% set frank_prices = state_attr('sensor.frank_energie_prices_current_electricity_price_all_in', 'prices') %}
          {% set entsoe_prices = state_attr('sensor.average_electricity_price', 'prices') %}
          {% set raw_list = frank_prices if (frank_prices is not none and frank_prices | length > 0) else entsoe_prices %}
          {% if raw_list is none or raw_list | length == 0 or hours_needed == 0 or
                window_start in ['unknown','unavailable','None'] or
                window_end in ['unknown','unavailable','None'] %}
            false
          {% else %}
            {% set ns = namespace(items=[]) %}
            {% for item in raw_list %}
              {% set t_raw = item['from'] if 'from' in item else item.from if item.from is defined else item['time'] if 'time' in item else item.time if item.time is defined else none %}
              {% if t_raw is not none %}
                {% set dt = as_local(as_datetime(t_raw)) if as_datetime(t_raw) is not none else none %}
                {% set t_str = dt.strftime('%Y-%m-%d %H:%M:%S') if dt is not none else (t_raw | string).replace('T', ' ')[:19] %}
                {% set ns.items = ns.items + [{'time': t_str}] %}
              {% endif %}
            {% endfor %}
            {% set window_prices = ns.items
                 | selectattr('time', '>=', window_start)
                 | selectattr('time', '<', window_end)
                 | list %}
            {% set hours_available = window_prices | length %}
            {% set hours_int = (hours_needed | int) + (1 if (hours_needed % 1) > 0 else 0) %}
            {{ (hours_available >= hours_int) | lower }}
          {% endif %}

      # Might be useful for debugging. Disable when all works fine.
      - name: EV Charging Debug Info
        unique_id: ev_charging_debug_info
        state: >
          {# Concise debug summary (strictly <= 255 chars for Home Assistant state limit) #}
          {% set frank_prices = state_attr('sensor.frank_energie_prices_current_electricity_price_all_in', 'prices') %}
          {% set entsoe_prices = state_attr('sensor.average_electricity_price', 'prices') %}
          {% set raw_list = frank_prices if (frank_prices is not none and frank_prices | length > 0) else entsoe_prices %}
          {% set hours_needed = states('sensor.ev_hours_needed_for_charging') | float(0) %}
          {% if raw_list is not none and raw_list | length > 0 %}
            {% set cutoff = now().strftime('%Y-%m-%d %H:00:00') %}
            {% set ns = namespace(future=[]) %}
            {% for item in raw_list %}
              {% set t_raw = item['from'] if 'from' in item else item.from if item.from is defined else item['time'] if 'time' in item else item.time if item.time is defined else none %}
              {% if t_raw is not none %}
                {% set dt = as_local(as_datetime(t_raw)) if as_datetime(t_raw) is not none else none %}
                {% set t_str = dt.strftime('%Y-%m-%d %H:%M:%S') if dt is not none else (t_raw | string).replace('T', ' ')[:19] %}
                {% if t_str >= cutoff %}
                  {% set ns.future = ns.future + [t_str] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.future | length }}/{{ raw_list | length }}h avail, need {{ hours_needed }}h
          {% else %}
            need {{ hours_needed }}h (no price data)
          {% endif %}
        attributes:
          price_source: >-
            {% set frank_prices = state_attr('sensor.frank_energie_prices_current_electricity_price_all_in', 'prices') %}
            {% if frank_prices is not none and frank_prices | length > 0 %}
              Frank Energie
            {% else %}
              ENTSO-E
            {% endif %}
          future_hours_available: >-
            {% set frank_prices = state_attr('sensor.frank_energie_prices_current_electricity_price_all_in', 'prices') %}
            {% set entsoe_prices = state_attr('sensor.average_electricity_price', 'prices') %}
            {% set raw_list = frank_prices if (frank_prices is not none and frank_prices | length > 0) else entsoe_prices %}
            {% if raw_list is none or raw_list | length == 0 %}
              0/0
            {% else %}
              {% set cutoff = now().strftime('%Y-%m-%d %H:00:00') %}
              {% set ns = namespace(future=[]) %}
              {% for item in raw_list %}
                {% set t_raw = item['from'] if 'from' in item else item.from if item.from is defined else item['time'] if 'time' in item else item.time if item.time is defined else none %}
                {% if t_raw is not none %}
                  {% set dt = as_local(as_datetime(t_raw)) if as_datetime(t_raw) is not none else none %}
                  {% set t_str = dt.strftime('%Y-%m-%d %H:%M:%S') if dt is not none else (t_raw | string).replace('T', ' ')[:19] %}
                  {% if t_str >= cutoff %}
                    {% set ns.future = ns.future + [t_str] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ ns.future | length }}/{{ raw_list | length }}
            {% endif %}
          hours_needed: "{{ states('sensor.ev_hours_needed_for_charging') }}"
          night_window: >-
            {% set start_hour = states('input_number.ev_window_charging_start_hour') | int(0) %}
            {% set end_hour = states('input_number.ev_window_charging_end_hour') | int(0) %}
            {{ '%02d:00' | format(start_hour) }} - {{ '%02d:00' | format(end_hour) }}{% if end_hour <= start_hour %} (crosses midnight){% endif %}
          window_start: "{{ states('sensor.ev_charging_window_start_time') }}"
          window_end: "{{ states('sensor.ev_charging_window_end_time') }}"
          max_price_enabled: "{{ states('input_boolean.ev_window_max_price_enabled') }}"
          max_price: "{{ states('input_number.ev_window_charging_max_price') }}"
          price_allowed: "{{ states('binary_sensor.ev_window_price_allowed') }}"
          current_price: "{{ states('sensor.frank_energie_prices_current_electricity_price_all_in') }}"
          details: >-
            {% set frank_prices = state_attr('sensor.frank_energie_prices_current_electricity_price_all_in', 'prices') %}
            {% set entsoe_prices = state_attr('sensor.average_electricity_price', 'prices') %}
            {% set raw_list = frank_prices if (frank_prices is not none and frank_prices | length > 0) else entsoe_prices %}
            {% set src_name = 'Frank Energie' if (frank_prices is not none and frank_prices | length > 0) else 'ENTSO-E' %}
            {% set start_hour = states('input_number.ev_window_charging_start_hour') | int(0) %}
            {% set end_hour = states('input_number.ev_window_charging_end_hour') | int(0) %}
            {% set hours_needed = states('sensor.ev_hours_needed_for_charging') | float(0) %}
            {% set hours_int = (hours_needed | int) + (1 if (hours_needed % 1) > 0 else 0) %}
            {% set window_start = states('sensor.ev_charging_window_start_time') %}
            {% set window_end = states('sensor.ev_charging_window_end_time') %}
            {% if raw_list is none or raw_list | length == 0 %}
              {% set future_count = 0 %}
              {% set total_count = 0 %}
            {% else %}
              {% set cutoff = now().strftime('%Y-%m-%d %H:00:00') %}
              {% set ns = namespace(future=[]) %}
              {% for item in raw_list %}
                {% set t_raw = item['from'] if 'from' in item else item.from if item.from is defined else item['time'] if 'time' in item else item.time if item.time is defined else none %}
                {% if t_raw is not none %}
                  {% set dt = as_local(as_datetime(t_raw)) if as_datetime(t_raw) is not none else none %}
                  {% set t_str = dt.strftime('%Y-%m-%d %H:%M:%S') if dt is not none else (t_raw | string).replace('T', ' ')[:19] %}
                  {% if t_str >= cutoff %}
                    {% set ns.future = ns.future + [t_str] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {% set future_count = ns.future | length %}
              {% set total_count = raw_list | length %}
            {% endif %}
            Price source: {{ src_name }}
            Future hours available: {{ future_count }}/{{ total_count }}
            Hours needed: {{ hours_needed }} (selecting {{ hours_int }} hours)
            Now: {{ now().isoformat() }}
            Cutoff: {{ now().strftime('%Y-%m-%d %H:00:00') }}
            Night window: {{ '%02d:00' | format(start_hour) }} - {{ '%02d:00' | format(end_hour) }} {% if end_hour <= start_hour %}(crosses midnight){% endif %}
            Window start: {{ window_start }}
            Window end: {{ window_end }}
            Max price enabled: {{ states('input_boolean.ev_window_max_price_enabled') }}
            Max price: {{ states('input_number.ev_window_charging_max_price') }} EUR/kWh
            Current price: {{ states('sensor.frank_energie_prices_current_electricity_price_all_in') }} EUR/kWh
            Price allowed: {{ states('binary_sensor.ev_window_price_allowed') }}