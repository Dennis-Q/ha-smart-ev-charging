script:
  ev_add_next_vehicle:
    alias: "EV: Voeg Nieuw Voertuig Toe"
    description: "Schakelt het eerstvolgende vrije voertuigslot in"
    icon: mdi:car-plus
    sequence:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.ev_v1_enabled
                state: "off"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.ev_v1_enabled
          - conditions:
              - condition: state
                entity_id: input_boolean.ev_v2_enabled
                state: "off"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.ev_v2_enabled
          - conditions:
              - condition: state
                entity_id: input_boolean.ev_v3_enabled
                state: "off"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.ev_v3_enabled
          - conditions:
              - condition: state
                entity_id: input_boolean.ev_v4_enabled
                state: "off"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.ev_v4_enabled
          - conditions:
              - condition: state
                entity_id: input_boolean.ev_v5_enabled
                state: "off"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.ev_v5_enabled

template:
  - sensor:
      - name: "EV Battery Percentage"
        unique_id: ev_battery_percentage
        unit_of_measurement: "%"
        device_class: battery
        icon: mdi:battery-charging
        state: >-
          {% set active = states('input_select.ev_active_vehicle') | trim %}
          {% set ns = namespace(sensor='') %}
          {% for i in range(1, 6) %}
            {% if is_state('input_boolean.ev_v' ~ i ~ '_enabled', 'on') and states('input_text.ev_v' ~ i ~ '_name') | trim == active %}
              {% set ns.sensor = states('input_text.ev_v' ~ i ~ '_battery_sensor') | trim %}
            {% endif %}
          {% endfor %}
          {% if ns.sensor not in ['', 'unknown', 'unavailable', 'none'] and states(ns.sensor) not in ['unknown', 'unavailable', 'none', ''] %}
            {{ states(ns.sensor) | float(0) | round(1) }}
          {% else %}
            0.0
          {% endif %}
        attributes:
          active_vehicle: "{{ states('input_select.ev_active_vehicle') }}"

      - name: "EV Active Battery Capacity"
        unique_id: ev_active_battery_capacity_kwh
        unit_of_measurement: "kWh"
        icon: mdi:battery-high
        state: >-
          {% set active = states('input_select.ev_active_vehicle') | trim %}
          {% set ns = namespace(val=60.0) %}
          {% for i in range(1, 6) %}
            {% if is_state('input_boolean.ev_v' ~ i ~ '_enabled', 'on') and states('input_text.ev_v' ~ i ~ '_name') | trim == active %}
              {% set ns.val = states('input_number.ev_v' ~ i ~ '_battery_capacity_kwh') | float(60.0) %}
            {% endif %}
          {% endfor %}
          {{ ns.val | round(1) }}
        attributes:
          active_vehicle: "{{ states('input_select.ev_active_vehicle') }}"

      - name: "EV Active Max Charge Power"
        unique_id: ev_active_max_charge_power_kw
        unit_of_measurement: "kW"
        device_class: power
        icon: mdi:flash
        state: >-
          {% set active = states('input_select.ev_active_vehicle') | trim %}
          {% set ns = namespace(val=11.0) %}
          {% for i in range(1, 6) %}
            {% if is_state('input_boolean.ev_v' ~ i ~ '_enabled', 'on') and states('input_text.ev_v' ~ i ~ '_name') | trim == active %}
              {% set ns.val = states('input_number.ev_v' ~ i ~ '_max_charge_power_kw') | float(11.0) %}
            {% endif %}
          {% endfor %}
          {{ ns.val | round(1) }}
        attributes:
          active_vehicle: "{{ states('input_select.ev_active_vehicle') }}"

      - name: "EV Active Target Battery Percentage"
        unique_id: ev_active_target_battery_percentage
        unit_of_measurement: "%"
        icon: mdi:battery-charging-100
        state: >-
          {% set active = states('input_select.ev_active_vehicle') | trim %}
          {% set ns = namespace(ent='') %}
          {% for i in range(1, 6) %}
            {% if is_state('input_boolean.ev_v' ~ i ~ '_enabled', 'on') and states('input_text.ev_v' ~ i ~ '_name') | trim == active %}
              {% set ns.ent = states('input_text.ev_v' ~ i ~ '_target_limit_entity') | trim %}
            {% endif %}
          {% endfor %}
          {% if ns.ent not in ['', 'unknown', 'unavailable', 'none'] and states(ns.ent) not in ['unknown', 'unavailable', 'none', ''] %}
            {{ states(ns.ent) | int(80) }}
          {% else %}
            80
          {% endif %}
        attributes:
          active_vehicle: "{{ states('input_select.ev_active_vehicle') }}"

      - name: "EV Active Target Limit Entity"
        unique_id: ev_active_target_limit_entity
        icon: mdi:code-tags
        state: >-
          {% set active = states('input_select.ev_active_vehicle') | trim %}
          {% set ns = namespace(ent='') %}
          {% for i in range(1, 6) %}
            {% if is_state('input_boolean.ev_v' ~ i ~ '_enabled', 'on') and states('input_text.ev_v' ~ i ~ '_name') | trim == active %}
              {% set ns.ent = states('input_text.ev_v' ~ i ~ '_target_limit_entity') | trim %}
            {% endif %}
          {% endfor %}
          {{ ns.ent }}

      - name: "EV Active Charge Switch Entity"
        unique_id: ev_active_charge_switch_entity
        icon: mdi:power
        state: >-
          {% set active = states('input_select.ev_active_vehicle') | trim %}
          {% set ns = namespace(ent='') %}
          {% for i in range(1, 6) %}
            {% if is_state('input_boolean.ev_v' ~ i ~ '_enabled', 'on') and states('input_text.ev_v' ~ i ~ '_name') | trim == active %}
              {% set ns.ent = states('input_text.ev_v' ~ i ~ '_charge_switch_entity') | trim %}
            {% endif %}
          {% endfor %}
          {{ ns.ent }}

automation:
  - id: ev_vehicle_update_options
    alias: "EV Vehicle Update Options List"
    description: "Update input_select.ev_active_vehicle options based on enabled vehicle slots"
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - input_boolean.ev_v1_enabled
          - input_boolean.ev_v2_enabled
          - input_boolean.ev_v3_enabled
          - input_boolean.ev_v4_enabled
          - input_boolean.ev_v5_enabled
          - input_text.ev_v1_name
          - input_text.ev_v2_name
          - input_text.ev_v3_name
          - input_text.ev_v4_name
          - input_text.ev_v5_name
    actions:
      - variables:
          opts: >-
            {% set ns = namespace(items=[]) %}
            {% for i in range(1, 6) %}
              {% set en = is_state('input_boolean.ev_v' ~ i ~ '_enabled', 'on') %}
              {% set nm = states('input_text.ev_v' ~ i ~ '_name') | trim %}
              {% if en and nm != '' %}
                {% set ns.items = ns.items + [nm] %}
              {% endif %}
            {% endfor %}
            {{ ns.items if ns.items | length > 0 else ['Geen voertuig'] }}
      - action: input_select.set_options
        target:
          entity_id: input_select.ev_active_vehicle
        data:
          options: "{{ opts }}"
      - if:
          - condition: template
            value_template: "{{ states('input_select.ev_active_vehicle') not in opts }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.ev_active_vehicle
            data:
              option: "{{ opts[0] }}"
