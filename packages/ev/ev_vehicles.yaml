### Multi-EV Dynamic Vehicle Management & Proxy Layer
#
# Provides 5 configurable vehicle slots.
# Vehicles can be enabled/added, configured, and disabled/deleted
# directly from the dashboard without any code changes in YAML.
#
# Note: 'initial:' is deliberately omitted on all helpers so Home Assistant's
# RestoreEntity mechanism preserves user changes across restarts.
# Default vehicles (Skoda Elroq & Dacia Spring) are populated automatically on
# a fresh install or when running script.ev_apply_vehicle_defaults.

input_select:
  ev_active_vehicle:
    name: "Actief Voertuig"
    icon: mdi:car-electric
    options:
      - "Skoda Elroq"
      - "Dacia Spring"

input_boolean:
  ev_v1_enabled:
    name: "Voertuig 1 Ingeschakeld"
    icon: mdi:car-check
  ev_v2_enabled:
    name: "Voertuig 2 Ingeschakeld"
    icon: mdi:car-check
  ev_v3_enabled:
    name: "Voertuig 3 Ingeschakeld"
    icon: mdi:car-check
  ev_v4_enabled:
    name: "Voertuig 4 Ingeschakeld"
