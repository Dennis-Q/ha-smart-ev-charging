script:
  ev_add_next_vehicle:
    alias: "EV: Voeg Nieuw Voertuig Toe"
    description: "Schakelt het eerstvolgende vrije voertuigslot in"
    icon: mdi:car-plus
    sequence:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.ev_v1_enabled
                state: "off"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ states('input_text.ev_v1_name') | trim in ['', 'unknown', 'unavailable'] }}"
                then:
                  - action: input_text.set_value
                    target: { entity_id: input_text.ev_v1_name }
                    data: { value: "Voertuig 1" }
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.ev_v1_enabled
          - conditions:
              - condition: state
                entity_id: input_boolean.ev_v2_enabled
                state: "off"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ states('input_text.ev_v2_name') | trim in ['', 'unknown', 'unavailable'] }}"
                then:
                  - action: input_text.set_value
                    target: { entity_id: input_text.ev_v2_name }
                    data: { value: "Voertuig 2" }
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.ev_v2_enabled
          - conditions:
              - condition: state
                entity_id: input_boolean.ev_v3_enabled
                state: "off"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ states('input_text.ev_v3_name') | trim in ['', 'unknown', 'unavailable'] }}"
                then:
                  - action: input_text.set_value
                    target: { entity_id: input_text.ev_v3_name }
                    data: { value: "Voertuig 3" }
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.ev_v3_enabled
          - conditions:
              - condition: state
                entity_id: input_boolean.ev_v4_enabled
                state: "off"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ states('input_text.ev_v4_name') | trim in ['', 'unknown', 'unavailable'] }}"
                then:
                  - action: input_text.set_value
                    target: { entity_id: input_text.ev_v4_name }
                    data: { value: "Voertuig 4" }
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.ev_v4_enabled
          - conditions:
              - condition: state
                entity_id: input_boolean.ev_v5_enabled
                state: "off"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ states('input_text.ev_v5_name') | trim in ['', 'unknown', 'unavailable'] }}"
                then:
                  - action: input_text.set_value
                    target: { entity_id: input_text.ev_v5_name }
                    data: { value: "Voertuig 5" }
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.ev_v5_enabled

  ev_apply_vehicle_defaults:
    alias: "EV: Herstel standaard voertuigen"
    description: >-
      Zet de 5 voertuigslots terug naar de standaardconfiguratie
      (Slot 1: Skoda Elroq, Slot 2: Dacia Spring, Slots 3-5: uitgeschakeld).
    icon: mdi:car-wrench
    sequence:
      # Slot 1: Skoda Elroq
      - action: input_text.set_value
        target: { entity_id: input_text.ev_v1_name }
        data: { value: "Skoda Elroq" }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_v1_battery_capacity_kwh }
        data: { value: 60.0 }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_v1_max_charge_power_kw }
        data: { value: 11.0 }
      - action: input_text.set_value
        target: { entity_id: input_text.ev_v1_battery_sensor }
        data: { value: "sensor.skoda_elroq_battery_percentage" }
      - action: input_text.set_value
        target: { entity_id: input_text.ev_v1_target_limit_entity }
        data: { value: "number.skoda_elroq_charge_limit" }
      - action: input_text.set_value
        target: { entity_id: input_text.ev_v1_charge_switch_entity }
        data: { value: "switch.skoda_elroq_charging" }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.ev_v1_enabled }

      # Slot 2: Dacia Spring
      - action: input_text.set_value
        target: { entity_id: input_text.ev_v2_name }
        data: { value: "Dacia Spring" }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_v2_battery_capacity_kwh }
        data: { value: 26.6 }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_v2_max_charge_power_kw }
        data: { value: 3.7 }
      - action: input_text.set_value
        target: { entity_id: input_text.ev_v2_battery_sensor }
        data: { value: "sensor.kjh95v_battery" }
      - action: input_text.set_value
        target: { entity_id: input_text.ev_v2_target_limit_entity }
        data: { value: "number.kjh95v_target_charge_level" }
      - action: input_text.set_value
        target: { entity_id: input_text.ev_v2_charge_switch_entity }
        data: { value: "" }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.ev_v2_enabled }

      # Slots 3-5: Standaardwaarden en uitgeschakeld
      - action: input_text.set_value
        target: { entity_id: input_text.ev_v3_name }
        data: { value: "Voertuig 3" }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_v3_battery_capacity_kwh }
        data: { value: 60.0 }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_v3_max_charge_power_kw }
        data: { value: 11.0 }
      - action: input_text.set_value
        target:
          entity_id:
            - input_text.ev_v3_battery_sensor
            - input_text.ev_v3_target_limit_entity
            - input_text.ev_v3_charge_switch_entity
        data: { value: "" }

      - action: input_text.set_value
        target: { entity_id: input_text.ev_v4_name }
        data: { value: "Voertuig 4" }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_v4_battery_capacity_kwh }
        data: { value: 60.0 }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_v4_max_charge_power_kw }
        data: { value: 11.0 }
      - action: input_text.set_value
        target:
          entity_id:
            - input_text.ev_v4_battery_sensor
            - input_text.ev_v4_target_limit_entity
            - input_text.ev_v4_charge_switch_entity
        data: { value: "" }

      - action: input_text.set_value
        target: { entity_id: input_text.ev_v5_name }
        data: { value: "Voertuig 5" }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_v5_battery_capacity_kwh }
        data: { value: 60.0 }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_v5_max_charge_power_kw }
        data: { value: 11.0 }
      - action: input_text.set_value
        target:
          entity_id:
            - input_text.ev_v5_battery_sensor
            - input_text.ev_v5_target_limit_entity
            - input_text.ev_v5_charge_switch_entity
        data: { value: "" }

      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.ev_v3_enabled
            - input_boolean.ev_v4_enabled
            - input_boolean.ev_v5_enabled

      - action: input_select.set_options
        target: { entity_id: input_select.ev_active_vehicle }
        data:
          options:
            - "Skoda Elroq"
            - "Dacia Spring"
      - action: input_select.select_option
        target: { entity_id: input_select.ev_active_vehicle }
        data: { option: "Skoda Elroq" }

template:
  - sensor:
      - name: "EV Battery Percentage"
        unique_id: ev_battery_percentage
        unit_of_measurement: "%"
        device_class: battery
        icon: mdi:battery-charging
        state: >-
          {% set active = states('input_select.ev_active_vehicle') | trim %}
          {% set ns = namespace(sensor='') %}
          {% for i in range(1, 6) %}
            {% if is_state('input_boolean.ev_v' ~ i ~ '_enabled', 'on') and states('input_text.ev_v' ~ i ~ '_name') | trim == active %}
              {% set ns.sensor = states('input_text.ev_v' ~ i ~ '_battery_sensor') | trim %}
            {% endif %}
          {% endfor %}
          {% if ns.sensor not in ['', 'unknown', 'unavailable', 'none'] and states(ns.sensor) not in ['unknown', 'unavailable', 'none', ''] %}
            {{ states(ns.sensor) | float(0) | round(1) }}
          {% else %}
            0.0
          {% endif %}
        attributes:
          active_vehicle: "{{ states('input_select.ev_active_vehicle') }}"

      - name: "EV Active Battery Capacity"
        unique_id: ev_active_battery_capacity_kwh
        unit_of_measurement: "kWh"
        icon: mdi:battery-high
        state: >-
          {% set active = states('input_select.ev_active_vehicle') | trim %}
          {% set ns = namespace(val=60.0) %}
          {% for i in range(1, 6) %}
            {% if is_state('input_boolean.ev_v' ~ i ~ '_enabled', 'on') and states('input_text.ev_v' ~ i ~ '_name') | trim == active %}
              {% set ns.val = states('input_number.ev_v' ~ i ~ '_battery_capacity_kwh') | float(60.0) %}
            {% endif %}
          {% endfor %}
          {{ ns.val | round(1) }}
        attributes:
          active_vehicle: "{{ states('input_select.ev_active_vehicle') }}"

      - name: "EV Active Max Charge Power"
        unique_id: ev_active_max_charge_power_kw
        unit_of_measurement: "kW"
        device_class: power
        icon: mdi:flash
        state: >-
          {% set active = states('input_select.ev_active_vehicle') | trim %}
          {% set ns = namespace(val=11.0) %}
          {% for i in range(1, 6) %}
            {% if is_state('input_boolean.ev_v' ~ i ~ '_enabled', 'on') and states('input_text.ev_v' ~ i ~ '_name') | trim == active %}
              {% set ns.val = states('input_number.ev_v' ~ i ~ '_max_charge_power_kw') | float(11.0) %}
            {% endif %}
          {% endfor %}
          {{ ns.val | round(1) }}
        attributes:
          active_vehicle: "{{ states('input_select.ev_active_vehicle') }}"

      - name: "EV Active Target Battery Percentage"
        unique_id: ev_active_target_battery_percentage
        unit_of_measurement: "%"
        icon: mdi:battery-charging-100
        state: >-
          {% set active = states('input_select.ev_active_vehicle') | trim %}
          {% set ns = namespace(ent='') %}
          {% for i in range(1, 6) %}
            {% if is_state('input_boolean.ev_v' ~ i ~ '_enabled', 'on') and states('input_text.ev_v' ~ i ~ '_name') | trim == active %}
              {% set ns.ent = states('input_text.ev_v' ~ i ~ '_target_limit_entity') | trim %}
            {% endif %}
          {% endfor %}
          {% if ns.ent not in ['', 'unknown', 'unavailable', 'none'] and states(ns.ent) not in ['unknown', 'unavailable', 'none', ''] %}
            {{ states(ns.ent) | int(80) }}
          {% else %}
            80
          {% endif %}
        attributes:
          active_vehicle: "{{ states('input_select.ev_active_vehicle') }}"

      - name: "EV Active Target Limit Entity"
        unique_id: ev_active_target_limit_entity
        icon: mdi:code-tags
        state: >-
          {% set active = states('input_select.ev_active_vehicle') | trim %}
          {% set ns = namespace(ent='') %}
          {% for i in range(1, 6) %}
            {% if is_state('input_boolean.ev_v' ~ i ~ '_enabled', 'on') and states('input_text.ev_v' ~ i ~ '_name') | trim == active %}
              {% set ns.ent = states('input_text.ev_v' ~ i ~ '_target_limit_entity') | trim %}
            {% endif %}
          {% endfor %}
          {{ ns.ent }}

      - name: "EV Active Charge Switch Entity"
        unique_id: ev_active_charge_switch_entity
        icon: mdi:power
        state: >-
          {% set active = states('input_select.ev_active_vehicle') | trim %}
          {% set ns = namespace(ent='') %}
          {% for i in range(1, 6) %}
            {% if is_state('input_boolean.ev_v' ~ i ~ '_enabled', 'on') and states('input_text.ev_v' ~ i ~ '_name') | trim == active %}
              {% set ns.ent = states('input_text.ev_v' ~ i ~ '_charge_switch_entity') | trim %}
            {% endif %}
          {% endfor %}
          {{ ns.ent }}

  - switch:
      - name: "EV Active Vehicle Charging"
        unique_id: ev_active_vehicle_charging
        icon: mdi:car-electric
        availability: >-
          {% set ent = states('sensor.ev_active_charge_switch_entity') | trim %}
          {{ ent not in ['', 'unknown', 'unavailable', 'none'] and states(ent) not in ['unknown', 'unavailable', 'none', ''] }}
        state: >-
          {% set ent = states('sensor.ev_active_charge_switch_entity') | trim %}
          {{ ent not in ['', 'unknown', 'unavailable', 'none'] and is_state(ent, 'on') }}
        turn_on:
          - variables:
              switch_ent: "{{ states('sensor.ev_active_charge_switch_entity') | trim }}"
          - if:
              - condition: template
                value_template: "{{ switch_ent not in ['', 'unknown', 'unavailable', 'none'] }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id: "{{ switch_ent }}"
        turn_off:
          - variables:
              switch_ent: "{{ states('sensor.ev_active_charge_switch_entity') | trim }}"
          - if:
              - condition: template
                value_template: "{{ switch_ent not in ['', 'unknown', 'unavailable', 'none'] }}"
            then:
              - action: switch.turn_off
                target:
                  entity_id: "{{ switch_ent }}"

automation:
  - id: ev_vehicle_update_options
    alias: "EV Vehicle Update Options List"
    description: "Initialize defaults on first boot and update input_select.ev_active_vehicle options based on enabled vehicle slots"
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - input_boolean.ev_v1_enabled
          - input_boolean.ev_v2_enabled
          - input_boolean.ev_v3_enabled
          - input_boolean.ev_v4_enabled
          - input_boolean.ev_v5_enabled
          - input_text.ev_v1_name
          - input_text.ev_v2_name
          - input_text.ev_v3_name
          - input_text.ev_v4_name
          - input_text.ev_v5_name
    actions:
      # Auto-seed default vehicles on a fresh install (when both Slot 1 and Slot 2 names are still empty)
      - if:
          - condition: template
            value_template: >-
              {{ states('input_text.ev_v1_name') | trim in ['', 'unknown', 'unavailable']
                 and states('input_text.ev_v2_name') | trim in ['', 'unknown', 'unavailable'] }}
        then:
          - action: script.turn_on
            target:
              entity_id: script.ev_apply_vehicle_defaults
          - delay:
              seconds: 1
      - variables:
          opts: >-
            {% set ns = namespace(items=[]) %}
            {% for i in range(1, 6) %}
              {% set en = is_state('input_boolean.ev_v' ~ i ~ '_enabled', 'on') %}
              {% set nm = states('input_text.ev_v' ~ i ~ '_name') | trim %}
              {% if en and nm not in ['', 'unknown', 'unavailable'] %}
                {% set ns.items = ns.items + [nm] %}
              {% endif %}
            {% endfor %}
            {{ ns.items if ns.items | length > 0 else ['Geen voertuig'] }}
      - action: input_select.set_options
        target:
          entity_id: input_select.ev_active_vehicle
        data:
          options: "{{ opts }}"
      - if:
          - condition: template
            value_template: "{{ states('input_select.ev_active_vehicle') not in opts }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.ev_active_vehicle
            data:
              option: "{{ opts[0] }}"
