### Solar related EV stuff

## Input helpers
input_boolean:
  ev_solar_charging:
    name: "EV Solar Charging"
    icon: mdi:sun-compass

  ev_battery_assist_charging:
    name: "EV Battery Assist Charging"
    icon: mdi:battery-charging

input_number:
  ev_charging_limit_solar:
    name: "EV Charging Limit Solar"
    unit_of_measurement: "%"
    min: 50
    max: 100
    step: 10
    icon: mdi:sun-clock

input_text:
  # Point these at real-time power sensors that report in W (not kW).
  # All four are optional — leave empty if not applicable to your setup.

  # ev_solar_power_entity_1 / _2
  #   Real-time AC output of a solar inverter in W (positive = producing).
  #   Supports two inverters (e.g. Enphase + SolarEdge); outputs are summed.
  #   When either is set, binary_sensor.ev_solar_viable uses the measured
  #   production instead of sun.sun above_horizon, so solar mode only
  #   activates when panels are actually producing — not at astronomical
  #   sunrise. Falls back to sun elevation > 5° when both are empty.
  #   Example: sensor.enphase_production_w  /  sensor.solaredge_ac_power
  ev_solar_power_entity_1:
    name: "EV Solar power entity 1"
    icon: mdi:solar-power
    max: 100
  ev_solar_power_entity_2:
    name: "EV Solar power entity 2"
    icon: mdi:solar-power
    max: 100

  # ev_home_battery_power_entity
  #   Net battery power from a home battery system in W (bidirectional:
  #   positive = discharging to the home/grid, negative = charging).
  #   When set, ev_grid_excess_power adds the charging component back
  #   (solar surplus absorbed by home batteries becomes visible to the EV
  #   charger) and subtracts the discharging component in every mode except
  #   battery_assist — so battery power being exported (e.g. a sell-to-grid
  #   strategy) never masquerades as solar surplus. Leave empty without a
  #   home battery.
  #   Example (HBA / Marstek): sensor.hba_total_battery_power
  ev_home_battery_power_entity:
    name: "EV Home battery power entity"
    icon: mdi:home-battery
    max: 100

  # ev_home_battery_assist_active_entity
  #   A binary_sensor published by your home battery system that is 'on'
  #   when the battery is willing to discharge for EV charging (e.g. SoC
  #   above a configured minimum, a discharge-for-EV strategy is running).
  #   When 'on' AND input_boolean.ev_battery_assist_charging is enabled,
  #   the EV enters battery_assist mode: surplus-tracking regulation (same
  #   as solar mode) with the home battery as the power source. Combining
  #   with solar is automatic — both sources contribute to ev_grid_excess.
  #   The battery system controls when this entity is active; the EV side
  #   only consumes the resulting boolean.
  #   Example (HBA): binary_sensor.hba_battery_assist_active
  ev_home_battery_assist_active_entity:
    name: "EV Home battery assist active entity"
    icon: mdi:battery-arrow-up
    max: 100

## Templates & sensors

sensor:
  - platform: statistics
    name: "EV Grid Excess Power Smoothed"
    unique_id: ev_grid_excess_power_smoothed
    entity_id: sensor.ev_grid_excess_power
    state_characteristic: median
    sampling_size: 5

template:
  - sensor:
      # Calculate available grid export power for EV charging (derived from P1 meter).
      # Expects sensor.electricity_meter_power_consumption and _production in W.
      # See binary_sensor.ev_p1_unit_mismatch — it turns ON when either sensor
      # reports a unit other than W, which will produce wrong results here.
      #
      # Home battery handling (when ev_home_battery_power_entity is set;
      # convention: positive = discharging, negative = charging):
      #   - the charging component is added back, so surplus the battery
      #     absorbs stays visible to the EV charger
      #   - the discharging component is subtracted in every mode except
      #     battery_assist, so battery power flowing to the grid (e.g. the
      #     battery system selling at expensive hours) is never mistaken for
      #     solar surplus. The subtraction is self-consistent even when the
      #     battery system regulates grid power with a PID: the value always
      #     converges to the true solar surplus (production minus house load).
      - name: "EV Grid Excess Power"
        unique_id: ev_grid_excess_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set grid_import = states('sensor.electricity_meter_power_consumption') | float(0) %}
          {% set grid_export = states('sensor.electricity_meter_power_production') | float(0) %}
          {# Fall back to 0, not a guessed draw. charger_power is ADDED to excess
             (it is what the charger is currently taking, which is available again
             if we back off), so an over-stated default inflates excess and the
             loop commands more current than the surplus supports — i.e. it pulls
             from the grid, silently, for as long as the sensor is unavailable.
             0 under-states excess instead, which makes the loop back off or stop:
             the safe direction, and self-correcting once the sensor returns. The
             previous default of 500 W was arbitrary and wrong in both directions
             (a phantom 500 W with no car, ~4 kW short mid-session). Every other
             read of this sensor in the package already defaults to 0. #}
          {% set charger_power = states('sensor.peblar_ev_charger_power') | float(0) %}
          {% set buffer = states('input_number.ev_power_buffer_watts') | float(0) %}
          {% set batt_e = states('input_text.ev_home_battery_power_entity') | trim %}
          {% set batt_power = states(batt_e) | float(0) if batt_e not in ['', 'unknown', 'unavailable', 'none'] else 0 %}
          {% set batt_charge = [-(batt_power), 0] | max %}
          {% set batt_discharge = 0 if is_state('sensor.ev_charging_mode', 'battery_assist') else [batt_power, 0] | max %}
          {% set current_power = grid_export - grid_import %}
          {% set excess = current_power + charger_power + batt_charge - batt_discharge - buffer %}
          {{ excess | round(0) }}

      # Calculate available charging amps for SINGLE PHASE.
      # Uses the live Peblar L1 voltage (Peblar charges single-phase on L1)
      # instead of a hardcoded 230 V — actual mains voltage varies (~220-245 V
      # in NL). Falls back to 230 V if the sensor is missing/unreachable.
      #
      # Why floor() instead of round(): plain round() was tried (see commit
      # 4feff0e) and reverted (see follow-up commit) because it visibly
      # destabilised the loop. Real-world logbook over ~10 minutes:
      #   floor: amp commands stayed in a 2 A window (12-14)
      #   round: amp commands swung across a 5 A window (11-16)
      # The 3-sample average is just noisy enough that rounding at half-amp
      # boundaries flips integer output cycle-to-cycle. floor()'s guarantee
      # of never overshooting also stops the feedback loop where bumping up
      # one amp draws more grid power, briefly shrinking excess, dropping
      # back down, etc.
      # Trade-off: floor() leaves up to 1 A worth (~230 W) of solar exported
      # at the boundary each cycle. Closing that gap properly would need
      # something more sophisticated than rounding — e.g. hysteresis ("only
      # change current command if new desired amps differs by ≥ 1 A from
      # the actually-flowing current"), or PID-style integration. Worth a
      # future iteration once we have data on charging-session totals.
      - name: "EV Available Charging Amps Single Phase"
        unique_id: ev_available_charging_amps_single_phase
        unit_of_measurement: "A"
        state: >
          {% set excess_power = states('sensor.ev_grid_excess_power_smoothed') | float(0) %}
          {% set v_l1 = states('sensor.peblar_ev_charger_voltage_phase_1') | float(0) %}
          {% set voltage = v_l1 if v_l1 > 100 else 230 %}
          {% set min_amps = 6 %}
          {% set max_amps = 16 %}
          {% if excess_power > 0 %}
            {% set calculated_amps = (excess_power / voltage) | round(0, 'floor') %}
            {% if calculated_amps >= min_amps %}
              {{ [calculated_amps, max_amps] | min }}
            {% else %}
              0
            {% endif %}
          {% else %}
            0
          {% endif %}

      # Calculate available charging amps for THREE PHASE.
      # Uses the SUM of the three live Peblar phase voltages instead of a
      # hardcoded 690 V. For 3-phase power P = sum(V_phase) × I (per phase
      # current), so summing the three measured phase voltages gives the
      # effective divisor regardless of how balanced the phases are.
      # Falls back to 690 V if any phase voltage sensor is unreachable.
      - name: "EV Available Charging Amps Three Phase"
        unique_id: ev_available_charging_amps_three_phase
        unit_of_measurement: "A"
        state: >
          {% set excess_power = states('sensor.ev_grid_excess_power_smoothed') | float(0) %}
          {% set v_l1 = states('sensor.peblar_ev_charger_voltage_phase_1') | float(0) %}
          {% set v_l2 = states('sensor.peblar_ev_charger_voltage_phase_2') | float(0) %}
          {% set v_l3 = states('sensor.peblar_ev_charger_voltage_phase_3') | float(0) %}
          {% set v_sum = v_l1 + v_l2 + v_l3 %}
          {% set voltage_3phase = v_sum if v_sum > 300 else 690 %}
          {% set min_amps = 6 %}
          {% set max_amps = 16 %}
          {% if excess_power > 0 %}
            {% set calculated_amps = (excess_power / voltage_3phase) | round(0, 'floor') %}
            {% if calculated_amps >= min_amps %}
              {{ [calculated_amps, max_amps] | min }}
            {% else %}
              0
            {% endif %}
          {% else %}
            0
          {% endif %}

      # Calculate available charging milliamps for SINGLE PHASE.
      # Same voltage fallback logic as the amp sensor above, but working in mA
      # gives 1 mA (≈ 0.23 W) precision instead of 1 A (≈ 230 W). floor() is
      # kept for the same stability reason documented above — avoids half-amp
      # boundary oscillation. The "up to 1 A wasted" comment no longer applies
      # here; the floor error is now ≤ 0.23 W per cycle.
      - name: "EV Available Charging mA Single Phase"
        unique_id: ev_available_charging_ma_single_phase
        unit_of_measurement: "mA"
        state: >
          {% set excess_power = states('sensor.ev_grid_excess_power_smoothed') | float(0) %}
          {% set v_l1 = states('sensor.peblar_ev_charger_voltage_phase_1') | float(0) %}
          {% set voltage = v_l1 if v_l1 > 100 else 230 %}
          {% set min_ma = 6000 %}
          {% set max_ma = 16000 %}
          {% if excess_power > 0 %}
            {% set calculated_ma = (excess_power / voltage * 1000) | round(0, 'floor') | int %}
            {% if calculated_ma >= min_ma %}
              {{ [calculated_ma, max_ma] | min }}
            {% else %}
              0
            {% endif %}
          {% else %}
            0
          {% endif %}

      # Calculate available charging milliamps for THREE PHASE.
      # Uses sum of live phase voltages as the divisor, same as the amp sensor.
      - name: "EV Available Charging mA Three Phase"
        unique_id: ev_available_charging_ma_three_phase
        unit_of_measurement: "mA"
        state: >
          {% set excess_power = states('sensor.ev_grid_excess_power_smoothed') | float(0) %}
          {% set v_l1 = states('sensor.peblar_ev_charger_voltage_phase_1') | float(0) %}
          {% set v_l2 = states('sensor.peblar_ev_charger_voltage_phase_2') | float(0) %}
          {% set v_l3 = states('sensor.peblar_ev_charger_voltage_phase_3') | float(0) %}
          {% set v_sum = v_l1 + v_l2 + v_l3 %}
          {% set voltage_3phase = v_sum if v_sum > 300 else 690 %}
          {% set min_ma = 6000 %}
          {% set max_ma = 16000 %}
          {% if excess_power > 0 %}
            {% set calculated_ma = (excess_power / voltage_3phase * 1000) | round(0, 'floor') | int %}
            {% if calculated_ma >= min_ma %}
              {{ [calculated_ma, max_ma] | min }}
            {% else %}
              0
            {% endif %}
          {% else %}
            0
          {% endif %}

      # Determine optimal phase mode
      - name: "EV Optimal Charging Phase Mode"
        unique_id: ev_optimal_charging_phase_mode
          #  {% set excess = states('sensor.ev_grid_excess_power') | float(0) %}
        state: >
          {% set excess = states('sensor.ev_grid_excess_power_smoothed') | float(0) %}
          {% set single_phase_amps = states('sensor.ev_available_charging_amps_single_phase') | int(0) %}
          {% set three_phase_amps = states('sensor.ev_available_charging_amps_three_phase') | int(0) %}
          {% set current_mode = states('switch.peblar_ev_charger_force_single_phase') %}
          {% set switch_to_3phase_threshold = states('input_number.ev_solar_switch_to_3phase_threshold_w') | float(4800) %}
          {% set switch_to_1phase_threshold = states('input_number.ev_solar_switch_to_1phase_threshold_w') | float(3500) %}
          {% set min_charge_threshold = states('input_number.ev_solar_min_charge_threshold_w') | float(1380) %}
          {% if excess < min_charge_threshold %}
            stop
          {% elif excess >= switch_to_3phase_threshold and three_phase_amps >= 6 %}
            three_phase
          {% elif excess <= switch_to_1phase_threshold %}
            single_phase
          {% else %}
            {% if current_mode == 'on' %}
              single_phase
            {% else %}
              three_phase
            {% endif %}
          {% endif %}

  - binary_sensor:
      # ON when solar panels are producing meaningful output.
      # If ev_solar_power_entity_1 or _2 are configured: ON when the sum of
      # their outputs exceeds 100 W, sustained for 2 minutes.
      # delay_off: 5 minutes prevents mode-flapping on brief clouds.
      # If both entities are empty: falls back to sun elevation > 5°.
      # 100 W is intentionally low — it gates "is the sun doing anything",
      # not "is there enough to charge". The actual stop/phase decision is
      # handled by sensor.ev_optimal_charging_phase_mode using
      # ev_solar_min_charge_threshold_w (1380 W).
      - name: "EV Solar Viable"
        unique_id: ev_solar_viable
        state: >
          {%- set e1 = states('input_text.ev_solar_power_entity_1') | trim -%}
          {%- set e2 = states('input_text.ev_solar_power_entity_2') | trim -%}
          {%- set skip = ['', 'unknown', 'unavailable', 'none'] -%}
          {%- set s1 = states(e1) | float(0) if e1 not in skip else 0 -%}
          {%- set s2 = states(e2) | float(0) if e2 not in skip else 0 -%}
          {%- set has_sensor = e1 not in skip or e2 not in skip -%}
          {{ (s1 + s2 > 100) if has_sensor else state_attr('sun.sun', 'elevation') | float(0) > 5 }}
        delay_on: "00:02:00"
        delay_off: "00:05:00"

      # ON when the charger cannot take more power than it currently delivers —
      # the "sink is saturated" signal for home battery coordination.
      # Two saturation causes, OR'ed:
      #   1. Pinned: the commanded current limit is at the 16 A maximum. This
      #      covers 16 A single-phase, 16 A three-phase, AND the phase-switch
      #      hysteresis band (surplus above 1-phase capacity but below the
      #      3-phase switch threshold, where the charger sits pinned at 16 A/1p).
      #   2. Derated: sensor.peblar_ev_charger_charge_current_limit_actual
      #      reports min(commanded, externally available) — when it drops below
      #      what we command, CT/household load balancing (or another charger
      #      constraint) is the binding limit and surplus will go unconsumed.
      #      The actual sensor is quantized to whole amps while the commanded
      #      limit is mA-fine, so the comparison floors the commanded value to
      #      whole amps first — otherwise ordinary regulation (e.g. commanded
      #      6350 mA, actual 6 A) reads as a permanent phantom derate. A
      #      genuine load-balancing derate is ≥ 1 A, so nothing real is lost.
      # Known blind spot (accepted): a current cap set inside the car is
      # invisible to the charger, so neither term fires for it.
      # delay_on: saturation must be sustained, not a ramp overshoot;
      # delay_off: survives the 1p→3p switchover dip and brief cloud edges,
      # answering the "what if it quickly swaps?" concern — the battery side
      # sees transitions minutes apart at worst.
      # Restart behaviour (measured in production 2026-07-12): the sensor
      # restores its pre-restart state. A stale restored 'on' takes
      # ~delay_off + integration startup (≈4 min) to release; a brand-new
      # entity reads 'unknown' for the first delay_off. Consumers treating
      # only 'on' as saturated (HBA does) are exposed to at most that stale
      # window after a reboot — accepted as bounded and self-correcting.
      # Consumed by HBA via input_text.hba_strategy_ev_saturated_entity_id to
      # gate "Charge PV during EV charge": the batteries only absorb residual
      # surplus while the charger is a constant load, never while it is
      # actively regulating — the two control loops cannot fight.
      - name: "EV Charger Saturated"
        unique_id: ev_charger_saturated
        state: >-
          {%- set charging = is_state('binary_sensor.ev_is_charging', 'on') -%}
          {%- set cmd_ma = states('number.peblar_ev_charger_charge_current_limit_ma') | float(0) -%}
          {%- set actual = states('sensor.peblar_ev_charger_charge_current_limit_actual') | float(-1) -%}
          {#- actual reports in A; tolerate a mA-reporting variant by scale-detecting -#}
          {%- set actual_ma = actual * 1000 if 0 <= actual < 100 else actual -%}
          {%- set pinned = cmd_ma >= 15900 -%}
          {%- set derated = actual_ma >= 0 and actual_ma < (cmd_ma // 1000) * 1000 -%}
          {{ charging and (pinned or derated) }}
        delay_on: "00:01:30"
        delay_off: "00:03:00"

      # ON when a configured solar or home battery power entity reports in kW
      # instead of W. All EV charging calculations expect W; kW input will
      # produce results roughly 1000× too small, silently breaking regulation.
      - name: "EV Power Entity Unit Mismatch"
        unique_id: ev_power_entity_unit_mismatch
        device_class: problem
        state: >-
          {%- set e1 = states('input_text.ev_solar_power_entity_1') | trim -%}
          {%- set e2 = states('input_text.ev_solar_power_entity_2') | trim -%}
          {%- set eb = states('input_text.ev_home_battery_power_entity') | trim -%}
          {%- set skip = ['', 'unknown', 'unavailable', 'none'] -%}
          {%- set u1 = state_attr(e1, 'unit_of_measurement') if e1 not in skip else 'W' -%}
          {%- set u2 = state_attr(e2, 'unit_of_measurement') if e2 not in skip else 'W' -%}
          {%- set ub = state_attr(eb, 'unit_of_measurement') if eb not in skip else 'W' -%}
          {{ u1 == 'kW' or u2 == 'kW' or ub == 'kW' }}
        attributes:
          solar_entity_1_unit: >-
            {%- set e = states('input_text.ev_solar_power_entity_1') | trim -%}
            {{ state_attr(e, 'unit_of_measurement') if e not in ['', 'unknown', 'unavailable', 'none'] else 'not set' }}
          solar_entity_2_unit: >-
            {%- set e = states('input_text.ev_solar_power_entity_2') | trim -%}
            {{ state_attr(e, 'unit_of_measurement') if e not in ['', 'unknown', 'unavailable', 'none'] else 'not set' }}
          battery_entity_unit: >-
            {%- set e = states('input_text.ev_home_battery_power_entity') | trim -%}
            {{ state_attr(e, 'unit_of_measurement') if e not in ['', 'unknown', 'unavailable', 'none'] else 'not set' }}

      # ON when either P1 sensor does not report in W.
      # ev_grid_excess_power auto-scales kW → W, but other unexpected units
      # (e.g. Wh, kWh, or unavailable) will still produce wrong results.
      # Use this sensor to drive a dashboard warning banner.
      - name: "EV P1 Unit Mismatch"
        unique_id: ev_p1_unit_mismatch
        device_class: problem
        state: >-
          {%- set unit_import = state_attr('sensor.electricity_meter_power_consumption', 'unit_of_measurement') -%}
          {%- set unit_export = state_attr('sensor.electricity_meter_power_production', 'unit_of_measurement') -%}
          {{ unit_import != 'W' or unit_export != 'W' }}
        attributes:
          unit_consumption: "{{ state_attr('sensor.electricity_meter_power_consumption', 'unit_of_measurement') }}"
          unit_production: "{{ state_attr('sensor.electricity_meter_power_production', 'unit_of_measurement') }}"

## Automations

automation:
  - id: ev_solar_charge_mode_control
    alias: "EV Solar Charge Mode Control"
    description: "Stops charger or switches between 1 and 3-phase mode"
    mode: restart # Reset timer when optimal phase mode is changed

    # when does it stop if ev_charging is disabled? and should it stop?
    # Create automation that stops charging unless manual override?
    # add variables, including expected target limit - source attribute
    # Add trigger when source limit is switched to solar ?
    # add that from stop to single_phase goes quicker first time (e.g. if ev_charging is off for more than 3 minteutes) ?
    triggers:
      - trigger: state
        entity_id: sensor.ev_optimal_charging_phase_mode
        to: "stop"
        for: "00:02:00"
        # for: "00:00:20" # for testing
        id: ev_stop
      - trigger: state
        entity_id: sensor.ev_optimal_charging_phase_mode
        to: "single_phase"
        for: "00:02:00" # was 3 but feels slow?
        # for: "00:00:30" # for testing
        id: ev_1p
      - trigger: state
        entity_id: sensor.ev_optimal_charging_phase_mode
        to: "three_phase"
        for: "00:04:00" # was 5 but feels slow?
        # for: "00:00:50" # for testing
        id: ev_3p
      # Fires when mode enters solar/battery_assist while ev_optimal_charging_phase_mode
      # was already 'stop' (e.g. window→solar at sunrise before any production).
      # Same 2-minute delay as ev_stop so behaviour is consistent.
      # If phase mode flips to single/three_phase within those 2 minutes the
      # existing ev_1p/ev_3p triggers take over (mode:restart cancels this one).
      - trigger: state
        entity_id: sensor.ev_charging_mode
        to:
          - "solar"
          - "battery_assist"
        for: "00:02:00"
        id: ev_mode_entry
      # Fast start for battery_assist: skips the 2-4 min phase-mode trigger delays.
      # Fires 30 s after mode entry so P1/battery readings have stabilised.
      - trigger: state
        entity_id: sensor.ev_charging_mode
        to: "battery_assist"
        for: "00:00:30"
        id: ev_battery_assist_entry
      # Phase recovery for battery_assist: fires 30 s after phase mode becomes
      # non-stop while in battery_assist. Catches the case where ev_battery_assist_entry
      # fires while phase mode is still stop (timing miss), and also re-arms after
      # each overflow-guard cycle that drops phase mode back to stop.
      # No-op if charger is already on or ev_charging_mode is not battery_assist.
      - trigger: state
        entity_id: sensor.ev_optimal_charging_phase_mode
        to:
          - "single_phase"
          - "three_phase"
        for: "00:00:30"
        id: ev_battery_assist_phase_recovery
    conditions:
      - condition: state
        entity_id: input_boolean.ev_manual_override
        state: "off"
      # Do not regulate a charger with no car on it. Nothing else in the solar
      # chain checks the plug: ev_charging_mode goes to 'solar' on
      # ev_solar_viable alone (sun/PV, not the car), and
      # ev_optimal_charging_phase_mode is pure arithmetic on excess vs the
      # thresholds. Without this gate the loop tracks surplus all day with an
      # empty cable, toggling switch.peblar_ev_charger_charge as clouds pass.
      # Observed 2026-07-26: ~19 toggles between 08:45 (unplug) and 15:04
      # (plug-in).
      #
      # The real damage is that whether the switch is left armed or disarmed at
      # plug-in time becomes a coin flip decided by cloud cover. On 2026-07-26
      # the last act before handover to 'cheapest' was a stop at 14:54:24 —
      # the home batteries tapering off shrank the batt_charge term below
      # ev_solar_min_charge_threshold_w — and the charger stayed dead through
      # the cheapest hour of the day. On 2026-07-24 the same loop happened to
      # leave it armed at 16:49 and the car charged on plug-in with no
      # automation involvement at all.
      #
      # Stop actions are gated too, deliberately: with no car connected there is
      # nothing to stop, and ev_generic's mode_none branch remains the
      # unconditional disarm path across a disconnect.
      - condition: state
        entity_id: binary_sensor.ev_is_connected
        state: "on"
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: state
                entity_id: sensor.ev_charging_mode
                state: "solar"
              - condition: state
                entity_id: input_boolean.ev_solar_charging
                state: "on"
          - condition: state
            entity_id: sensor.ev_charging_mode
            state: "battery_assist"
    actions:
      - choose:
          # Stop — solar mode only. In battery_assist the home battery side is
          # the authority on when to push: excess collapses to ~0 whenever it
          # abstains (e.g. HBA's "waiting for EV" state while the charger needs
          # a tag scan or the car paused itself). The charger must stay armed in
          # that state so the car can resume drawing (tag scan, limit raised) —
          # that draw is the very signal that wakes the battery side back up.
          # An armed charger with a suspended car draws 0 W, so leaving it on is
          # harmless. When assist ends, ev_charging_mode leaves battery_assist
          # and the generic mode control (mode 'none') stops the charger.
          - conditions:
              - condition: trigger
                id: ev_stop
              - condition: not
                conditions:
                  - condition: state
                    entity_id: sensor.ev_charging_mode
                    state: "battery_assist"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.peblar_ev_charger_charge
          # 1-phase
          - conditions:
              - condition: trigger
                id: ev_1p
            sequence:
              - action: number.set_value
                target:
                  entity_id: number.peblar_ev_charger_charge_current_limit_ma
                data:
                  value: >
                    {% set ma = states('sensor.ev_available_charging_ma_single_phase') | int(6000) %}
                    {{ ma if ma >= 6000 else 6000 }}
              - action: switch.turn_on # force single phase charging
                target:
                  entity_id: switch.peblar_ev_charger_force_single_phase
              - action: switch.turn_on # allow charging
                target:
                  entity_id: switch.peblar_ev_charger_charge
          # 3-phase
          - conditions:
              - condition: trigger
                id: ev_3p
            sequence:
              - action: number.set_value # start with a safe 6 A (6000 mA) when switching to 3P
                target:
                  entity_id: number.peblar_ev_charger_charge_current_limit_ma
                data:
                  value: 6000
              - action: switch.turn_off # switch to 3-phase mode
                target:
                  entity_id: switch.peblar_ev_charger_force_single_phase
              - action: switch.turn_on # allow charging
                target:
                  entity_id: switch.peblar_ev_charger_charge
          # Mode entry cleanup: charger was left on by window/cheapest and
          # phase mode is already stop — turn off without waiting for a
          # phase-mode state change that will never come.
          # Solar mode only: in battery_assist the charger stays armed even at
          # phase mode 'stop' (see the ev_stop branch comment above).
          - conditions:
              - condition: trigger
                id: ev_mode_entry
            sequence:
              - if:
                  - condition: state
                    entity_id: sensor.ev_charging_mode
                    state: "solar"
                  - condition: state
                    entity_id: sensor.ev_optimal_charging_phase_mode
                    state: "stop"
                  - condition: state
                    entity_id: switch.peblar_ev_charger_charge
                    state: "on"
                then:
                  - action: switch.turn_off
                    target:
                      entity_id: switch.peblar_ev_charger_charge
          # Battery assist fast start: start charging 30 s after mode entry
          # without waiting for ev_1p/ev_3p trigger delays. No-op if the
          # charger is already on or phase mode is still stop.
          - conditions:
              - condition: trigger
                id: ev_battery_assist_entry
              - condition: state
                entity_id: switch.peblar_ev_charger_charge
                state: "off"
            sequence:
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: sensor.ev_optimal_charging_phase_mode
                        state: "single_phase"
                    sequence:
                      - action: number.set_value
                        target:
                          entity_id: number.peblar_ev_charger_charge_current_limit_ma
                        data:
                          value: >
                            {% set ma = states('sensor.ev_available_charging_ma_single_phase') | int(6000) %}
                            {{ ma if ma >= 6000 else 6000 }}
                      - action: switch.turn_on
                        target:
                          entity_id: switch.peblar_ev_charger_force_single_phase
                      - action: switch.turn_on
                        target:
                          entity_id: switch.peblar_ev_charger_charge
                  - conditions:
                      - condition: state
                        entity_id: sensor.ev_optimal_charging_phase_mode
                        state: "three_phase"
                    sequence:
                      - action: number.set_value
                        target:
                          entity_id: number.peblar_ev_charger_charge_current_limit_ma
                        data:
                          value: 6000
                      - action: switch.turn_off
                        target:
                          entity_id: switch.peblar_ev_charger_force_single_phase
                      - action: switch.turn_on
                        target:
                          entity_id: switch.peblar_ev_charger_charge
          # Phase recovery for battery_assist: fires after ev_battery_assist_phase_recovery
          # trigger (phase mode non-stop for 30 s). Handles the case where
          # ev_battery_assist_entry fired while phase mode was still stop, and
          # also re-arms the charger after each overflow-guard cycle resets phase mode.
          - conditions:
              - condition: trigger
                id: ev_battery_assist_phase_recovery
              - condition: state
                entity_id: sensor.ev_charging_mode
                state: "battery_assist"
              - condition: state
                entity_id: switch.peblar_ev_charger_charge
                state: "off"
            sequence:
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: sensor.ev_optimal_charging_phase_mode
                        state: "single_phase"
                    sequence:
                      - action: number.set_value
                        target:
                          entity_id: number.peblar_ev_charger_charge_current_limit_ma
                        data:
                          value: >
                            {% set ma = states('sensor.ev_available_charging_ma_single_phase') | int(6000) %}
                            {{ ma if ma >= 6000 else 6000 }}
                      - action: switch.turn_on
                        target:
                          entity_id: switch.peblar_ev_charger_force_single_phase
                      - action: switch.turn_on
                        target:
                          entity_id: switch.peblar_ev_charger_charge
                  - conditions:
                      - condition: state
                        entity_id: sensor.ev_optimal_charging_phase_mode
                        state: "three_phase"
                    sequence:
                      - action: number.set_value
                        target:
                          entity_id: number.peblar_ev_charger_charge_current_limit_ma
                        data:
                          value: 6000
                      - action: switch.turn_off
                        target:
                          entity_id: switch.peblar_ev_charger_force_single_phase
                      - action: switch.turn_on
                        target:
                          entity_id: switch.peblar_ev_charger_charge

  - id: ev_solar_dynamic_power_control
    alias: "EV Solar Dynamic Power Control"
    description: "Adapt power control quickly"
    # mode: silent

    triggers:
      - trigger: time_pattern
        seconds: "/3"
      # - trigger: state # is probably every second? too much ?
      #   entity_id: sensor.ev_grid_excess_power_smoothed
    conditions:
      - condition: state
        entity_id: input_boolean.ev_manual_override
        state: "off"
      # Same plug gate as the mode control above. The charge-switch condition
      # below is not sufficient on its own: the switch can sit armed with no car
      # attached (any stop path that fails to disarm, or a plug-out while on),
      # and this automation then writes the mA register every 3 s indefinitely.
      - condition: state
        entity_id: binary_sensor.ev_is_connected
        state: "on"
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: state
                entity_id: sensor.ev_charging_mode
                state: "solar"
              - condition: state
                entity_id: input_boolean.ev_solar_charging
                state: "on"
          - condition: state
            entity_id: sensor.ev_charging_mode
            state: "battery_assist"
      - condition: state
        entity_id: switch.peblar_ev_charger_charge
        state: "on"
    actions:
      - action: number.set_value
        target:
          entity_id: number.peblar_ev_charger_charge_current_limit_ma
        data:
          value: >
            {% set mode = states('sensor.ev_optimal_charging_phase_mode') %}
            {% set ma_3f = states('sensor.ev_available_charging_ma_three_phase') | int(0) %}
            {% set ma_1f = states('sensor.ev_available_charging_ma_single_phase') | int(0) %}
            {% set single_phase_mode = is_state('switch.peblar_ev_charger_force_single_phase', 'on') %}
            {% if mode == 'stop' %}
              6000
            {% elif mode == 'three_phase' and single_phase_mode %}
              {# Enough power for 3-phase but still in 1-phase-mode, so max power! #}
              16000
            {% elif mode == 'three_phase' and not single_phase_mode %}
              {# Three-phase mode and active #}
              {{ ma_3f if ma_3f >= 6000 else 6000 }}
            {% elif mode == 'single_phase' and not single_phase_mode %}
              {# Single phase mode but not active yet #}
              6000
            {% else %}
              {# Single phase mode and also active #}
              {{ ma_1f if ma_1f >= 6000 else 6000 }}
            {% endif %}
