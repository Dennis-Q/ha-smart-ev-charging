  #           priority: high
  #           tag: ev_cable_connected
  #           color: blue

  # Set force charge timeout (one-time)
  - id: "ev_force_charge_set_timeout"
    alias: "EV Force Charge - Set 8 Hour Timeout"
    description: "Set timeout when force charge activated"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: input_boolean.ev_force_charge_once
        to: "on"
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ev_force_charge_timeout
        data:
          datetime: "{{ (now() + timedelta(hours=8)).strftime('%Y-%m-%d %H:%M:%S') }}"

  # Auto-disable force charge on timeout
  - id: "ev_force_charge_auto_disable_timeout"
    alias: "EV Force Charge Auto Disable on 8 Hour Timeout"
    description: "Automatically disable after 8 hours"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.ev_force_charge_once
        state: "on"
      - condition: template
        value_template: "{{ states('input_datetime.ev_force_charge_timeout') not in ['unknown', 'unavailable', 'none'] }}"
      - condition: template
        value_template: "{{ now() | as_timestamp >= (states('input_datetime.ev_force_charge_timeout') | as_timestamp) }}"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ev_force_charge_once
      - action: script.ev_notify_dispatch
        data:
          title: "EV Force Charge Timeout"
          message: "Force charge once disabled after 8 hours"
          tag: ev_force_timeout
          color: orange
          priority: high

  # Auto-disable force charge (once) when full
  - id: "ev_force_charge_auto_disable_full"
    alias: "EV Force Charge (Once) Auto Disable on Full"
    description: "Disable when battery reaches force charge limit"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: template
        value_template: >
          {% set limit = states('input_number.ev_charging_limit_force') | int(1) %}
          {{ (states('sensor.skoda_elroq_battery_percentage') | int(0)) >= (limit - 1) and is_state('input_boolean.ev_force_charge_once', 'on') }}
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ev_force_charge_once
      - action: script.ev_notify_dispatch
        data:
          title: "EV Force Charge Complete (one-time)"
          message: "Car fully charged"
          tag: ev_force_complete
          color: green
          priority: high

  # Auto-disable force charge (once) when the cable is unplugged.
  # Makes one-time force charging truly one-time: the session ends on
  # disconnect, not just on the 8-hour timeout or reaching the limit.
  # The 1-minute `for:` debounce absorbs transient unavailable/unknown
  # reads (ev_is_connected is off for those too), so a brief integration
  # blip does not end the session. Permanent force charge is unaffected.
  - id: "ev_force_charge_once_disable_on_disconnect"
    alias: "EV Force Charge (Once) Auto Disable on Disconnect"
    description: "Disable one-time force charge when the cable is disconnected"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.ev_is_connected
        to: "off"
        for:
          minutes: 1
    conditions:
      - condition: state
        entity_id: input_boolean.ev_force_charge_once
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ev_force_charge_once
      - action: script.ev_notify_dispatch
        data:
          title: "EV Force Charge Ended (one-time)"
          message: "Cable disconnected — one-time force charging disabled"
          tag: ev_force_disconnect
          color: orange
          priority: high

  # Activate permanent force charging
  - id: "ev_force_charge_permanent_activate"
    alias: "EV Force Charge Permanent - Activate"
    description: "Activate permanent force charging mode"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: input_boolean.ev_force_charge_permanent
        to: "on"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ev_force_charge_once
      - action: script.ev_notify_dispatch
        data:
          title: "EV Permanent Force Charge Activated"
          message: "Permanent force charging enabled - One-time force charging disabled"
          tag: ev_permanent_force_active
          color: red
          priority: high

  # Deactivate permanent force charging
  # Idea: also create one for manual override (with additional daily check?)
  - id: "ev_force_charge_permanent_deactivate"
    alias: "EV Force Charge Permanent - Deactivate"
    description: "Deactivate permanent force charging mode"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: input_boolean.ev_force_charge_permanent
        to: "off"
    actions:
      - action: script.ev_notify_dispatch
        data:
          title: "EV Permanent Force Charge Deactivated"
          message: "Permanent force charging disabled - automations resumed but might not be enabled"
          tag: ev_permanent_force_inactive
          color: green
          priority: high

  # Force charge activation - configure charger and optionally start charging
  - id: "ev_force_charge_override_enabled"
    alias: "EV Force Charge Override Enabled"
    description: "Handle force charge activation - always configure charger, start charging only if cable connected"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: input_boolean.ev_force_charge_once
        to: "on"
      - trigger: state
        entity_id: input_boolean.ev_force_charge_permanent
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.ev_manual_override
        state: "off"
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.peblar_ev_charger_force_single_phase
      - action: number.set_value
        target:
          entity_id: number.peblar_ev_charger_charge_current_limit_ma
        data:
          value: 16000
      - action: switch.turn_on
        target:
          entity_id: switch.peblar_ev_charger_charge
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.ev_is_connected
                state: "on"
              # - condition: template
              #   value_template: "{{ states('sensor.peblar_ev_charger_state') not in ['unavailable', 'unknown', 'no_ev_connected'] }}"
            sequence:
              - action: number.set_value
                target:
                  entity_id: number.skoda_elroq_charge_limit # probably also handled by ev charge validation automation
                data:
                  value: "{{ states('input_number.ev_charging_limit_force') | int(100) }}"
              ## Not needed? Automation might get stuck when Car API is non-responsive
              - action: switch.turn_on
                target:
                  entity_id: switch.skoda_elroq_charging
              - action: script.ev_notify_dispatch
                data:
                  title: "EV Force Charge Activated"
                  message: "Maximum charging at 3-phase 16A"
                  tag: ev_force_active
                  color: red
                  priority: high
          - conditions:
              - condition: state
                entity_id: binary_sensor.ev_is_connected
                state: "off"
            sequence:
              - action: script.ev_notify_dispatch
                data:
                  title: "EV Force Charge - Cable Not Connected"
                  message: "Charger configured to 3-phase 16A. Please connect cable to start charging."
                  tag: ev_force_cable_missing
                  color: orange
                  priority: high

  # Validate charging limit
  # reduce triggers / API calls further
  - id: "ev_validate_charging_limit"
    alias: "EV Validate Charging Limit"
    description: "Validate and reset charging limit"
    mode: single
    max_exceeded: silent
    triggers:
      # - trigger: time_pattern
      #   minutes: "/10" # was /2
      - trigger: state # trigger on any state change
        entity_id: 
          - sensor.skoda_elroq_target_battery_percentage
      - trigger: state # trigger any state not not to unknown
        entity_id: sensor.ev_expected_charging_limit
        not_to: "unknown"
      - trigger: state # trigger on 'on' state
        entity_id:
          - binary_sensor.skoda_elroq_charger_connected
          - input_boolean.ev_force_charge_permanent
          - input_boolean.ev_force_charge_once
          - input_boolean.ev_solar_charging
          - input_boolean.ev_battery_assist_charging
          - input_boolean.ev_window_charging
          - binary_sensor.ev_is_charging
          - binary_sensor.ev_is_connected
        to: "on"
      - trigger: state # trigger on 'off' state
        entity_id: input_boolean.ev_manual_override
        to: "off"
    condition:
      - condition: state
        entity_id: input_boolean.ev_manual_override
        state: "off"
      - condition: state
        entity_id: binary_sensor.ev_is_connected
        state: "on"
      - condition: template
        value_template: >
          {% set current_limit = states('sensor.skoda_elroq_target_battery_percentage') | int %}
          {% set expected_limit = states('sensor.ev_expected_charging_limit') | int %}
          {{ current_limit != expected_limit }}
    actions:
      - variables:
          expected_limit: "{{ states('sensor.ev_expected_charging_limit') | int }}"
          current_limit: "{{ states('sensor.skoda_elroq_target_battery_percentage') | int }}"
      - action: number.set_value
        target:
          entity_id: number.skoda_elroq_charge_limit
        data:
          value: "{{ expected_limit }}"
      - action: script.ev_notify_dispatch
        data:
          title: "EV Charging Limit Corrected"
          message: "Corrected from {{ current_limit }}% to {{ expected_limit }}%"
          tag: ev_limit_corrected
          color: yellow
          priority: high

  # Charging complete notification
  # Not much testing so far!
  - id: "ev_charging_complete_notification"
    alias: "EV Charging Complete Notification"
    description: "Notify when EV reaches configured charge limit"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: numeric_state
        entity_id: sensor.skoda_elroq_battery_percentage
        above: 99
      - trigger: template
        value_template: >-
          {{
            states('sensor.skoda_elroq_battery_percentage') | int(0)
            >=
            states('sensor.ev_expected_charging_limit') | int(101)
          }}
    condition:
      - condition: state
        entity_id: binary_sensor.ev_is_connected
        state: "on"
      - condition: state
        entity_id: input_boolean.ev_force_charge_permanent
        state: "off"
    actions:
      - action: script.ev_notify_dispatch
        data:
          title: "EV Charging Complete"
          message: >-
            Your Elroq has reached the set charging limit of
            {{ states('sensor.ev_expected_charging_limit') }}%
            (current: {{ states('sensor.skoda_elroq_battery_percentage') }}%).
          tag: ev_complete
          color: green
          priority: high

  - id: ev_charger_error_notification
    alias: "EV Charger Error Notification"
    description: "Send notification when Peblar charger is in unfeasible state."
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.peblar_ev_charger_state
        to:
          - "error"
          - "fault"
          - "invalid"
    conditions:
      - condition: state
        entity_id: input_boolean.ev_notifications_enabled
        state: "on"
    actions:
      - action: script.ev_notify_dispatch
        data:
          title: "EV Charger in unexpected state"
          message: "Peblar in state '{{ trigger.to_state.state }}'. Please check ASAP!"
          tag: ev_charger_in_error
          color: red
          priority: high

  - id: ev_generic_charging_mode_control
    alias: "EV Generic Charge Mode Control"
    description: "Controls charger based on charging mode (except Solar)"
    mode: restart # Reset timer when optimal phase mode is changed

    # when does it stop if ev_charging is disabled?
    # if mode changes from something else then none, when will it stop?
    # add variables? including expected target limit source
    # Add trigger when source limit is switched to solar ?

    triggers:
      - trigger: state
        entity_id: sensor.ev_charging_mode
        to:
          - "force"
          - "cheapest"
          - "window"
        id: mode_full_power
        for: "00:00:30"
        # not_from:
        #   - "unknown"
        #   - "unavailable"
      - trigger: state
        entity_id: sensor.ev_charging_mode
        to:
          - "none"
        id: mode_none
        for: "00:00:30"
        # not_from:
        #   - "unknown"
        #   - "unavailable"
    conditions: # some disabled for testing?
      - condition: state
        entity_id: input_boolean.ev_manual_override
        state: "off"
      - condition: state # do not use as this causes things not to work!
        entity_id: binary_sensor.ev_is_connected
        state: "on"
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: mode_full_power
            sequence:
              - action: number.set_value # maximize power
                target:
                  entity_id: number.peblar_ev_charger_charge_limit
                data:
                  value: 16
              - action: switch.turn_off # switch to 3-phase mode
                target:
                  entity_id: switch.peblar_ev_charger_force_single_phase
              - action: switch.turn_on # allow charging
                target:
                  entity_id: switch.peblar_ev_charger_charge
          - conditions:
              - condition: trigger
                id: mode_none
            sequence:
              - action: switch.turn_off # Stop charging if no mode is selected
                target:
                  entity_id: switch.peblar_ev_charger_charge

  # Notify when Peblar charger has active warnings or errors (and when cleared).
  - id: ev_notify_charger_alert
    alias: "EV Charger Alert Notification"
    description: "Notify on charger warning/error codes; send cleared notification when resolved"
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.peblar_ev_charger_active_warnings
          - binary_sensor.peblar_ev_charger_active_errors
    conditions:
      - condition: state
        entity_id: input_boolean.ev_notifications_enabled
        state: "on"
    actions:
      - variables:
          has_alert: >-
            {{ is_state('binary_sensor.peblar_ev_charger_active_warnings', 'on') or is_state('binary_sensor.peblar_ev_charger_active_errors', 'on') }}
          active_codes: >-
            {%- set ns = namespace(codes=[]) -%}
            {%- for i in [1,2,3,4,5] -%}
              {%- set v = states('sensor.peblar_ev_charger_active_error_' ~ i) | int(0) -%}
              {%- if v > 0 -%}{%- set ns.codes = ns.codes + ['Error ' ~ v] -%}{%- endif -%}
            {%- endfor -%}
            {%- for i in [1,2,3,4,5] -%}
              {%- set v = states('sensor.peblar_ev_charger_active_warning_' ~ i) | int(0) -%}
              {%- if v > 0 -%}{%- set ns.codes = ns.codes + ['Warning ' ~ v] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.codes | join(', ') }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ has_alert }}"
            sequence:
              - action: script.ev_notify_dispatch
                data:
                  title: "EV Charger Alert"
                  message: "Active: {{ active_codes }}. Check the charger web interface for details."
                  tag: ev_charger_alert
                  color: red
                  priority: high
        default:
          - action: script.ev_notify_dispatch
            data:
              title: "EV Charger Alert Cleared"
              message: "All charger warnings and errors have been resolved."
              tag: ev_charger_alert
              color: green
              priority: normal

  # Notify when the charger is drawing power while the charge switch is off.
  # Catches cases where another control source (e.g. a stuck REST command) is
  # keeping the charger active despite HA having switched it off.
  - id: ev_notify_unexpected_charging
    alias: "EV Unexpected Charging Notification"
    description: "Notify when charger power > 0 W for 3 min with charge switch off"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: numeric_state
        entity_id: sensor.peblar_ev_charger_power
        above: 0
        for: "00:03:00"
    conditions:
      - condition: state
        entity_id: switch.peblar_ev_charger_charge
        state: "off"
      - condition: state
        entity_id: input_boolean.ev_notifications_enabled
        state: "on"
    actions:
      - action: script.ev_notify_dispatch
        data:
          title: "EV Unexpected Charging"
          message: >-
            Charger is drawing {{ states('sensor.peblar_ev_charger_power') }} W
            but the charge switch is off. Check for an unexpected control source.
          tag: ev_unexpected_charging
          color: orange
          priority: high

  # Remind when manual override has been left on for 4+ hours.
  # Manual override disables all EV automations — easy to forget.
  - id: ev_notify_manual_override_reminder
    alias: "EV Manual Override Reminder"
    description: "Remind when manual override stays on for 4+ hours"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: input_boolean.ev_manual_override
        to: "on"
        for: "04:00:00"
    conditions:
      - condition: state
        entity_id: input_boolean.ev_notifications_enabled
        state: "on"
    actions:
      - action: script.ev_notify_dispatch
        data:
          title: "EV Manual Override Still Active"
          message: "Manual override has been on for 4+ hours. All EV automations remain paused."
          tag: ev_manual_override_reminder
          color: orange
          priority: normal

  # Alert: EV charging when mode is 'none', or grid draw during solar/battery_assist.
  # binary_sensor.ev_unexpected_grid_charging already gates on manual_override and
  # delay_on 5 min, so this automation fires only on genuine sustained problems.
  # Push + persistent_notification on start; push-only on resolve (HA bell stays
  # until the user manually dismisses it — intentional for overnight visibility).
  - id: ev_notify_unexpected_grid_charging
    alias: "EV Notify Unexpected Grid Charging"
    description: "Push + persistent alert when EV draws power unexpectedly for 5+ min"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.ev_unexpected_grid_charging
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.ev_notifications_enabled
        state: "on"
    actions:
      - variables:
          mode: "{{ states('sensor.ev_charging_mode') }}"
          power: "{{ states('sensor.peblar_ev_charger_power') | float(0) | round(0) | int }}"
          grid: "{{ states('sensor.p1_meter_power') | float(0) | round(0) | int }}"
      - action: script.ev_notify_dispatch
        data:
          title: "EV Unexpected Charging"
          message: >-
            {% if mode == 'none' %}
              Charger running at {{ power }} W but mode is 'none' — nothing authorised charging.
            {% else %}
              Charger pulling {{ power }} W with {{ grid }} W grid import while in {{ mode }} mode.
            {% endif %}
            Check EV dashboard.
          tag: ev_unexpected_grid_charging
          color: red
          priority: high
      - action: persistent_notification.create
        data:
          notification_id: ev_unexpected_grid_charging
          title: "EV Unexpected Charging"
          message: >-
            {% if mode == 'none' %}
              Charger running at {{ power }} W but mode is 'none' — nothing authorised charging.
            {% else %}
              Charger pulling {{ power }} W with {{ grid }} W grid import while in {{ mode }} mode.
            {% endif %}

  - id: ev_notify_unexpected_grid_charging_resolved
    alias: "EV Notify Unexpected Grid Charging Resolved"
    description: "Push notification when unexpected charging stops (persistent HA notification stays)"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.ev_unexpected_grid_charging
        to: "off"
        from: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.ev_notifications_enabled
        state: "on"
      # Skip the push when manual override caused the binary_sensor to clear —
      # the user already knows why it stopped.
      - condition: state
        entity_id: input_boolean.ev_manual_override
        state: "off"
    actions:
      - action: script.ev_notify_dispatch
        data:
          title: "EV Unexpected Charging Resolved"
          message: "Unexpected EV charging has stopped. Check the HA notification bell for details."
          tag: ev_unexpected_grid_charging_resolved
          color: green
          priority: normal

# ── Recorder exclusions ───────────────────────────────────────────────────────
# Skip high-frequency / debug-only EV entities from the history database.
# Other packages (e.g. a home battery package) may add their own recorder
# excludes in separate files; HA merges all package recorder blocks at load time.
#
# What's intentionally kept:
#   - sensor.ev_optimal_charging_phase_mode: low-cardinality decision output
#     (stop / single_phase / three_phase); transitions only
#   - All other input_*.ev_*, binary_sensor.ev_*, automations, scripts
recorder:
  exclude:
    entities:
      - sensor.ev_grid_excess_power
      # Smoothed control signal — changes at P1 rate (~1 Hz), not useful as history
      - sensor.ev_grid_excess_power_smoothed
      - sensor.ev_available_charging_amps_single_phase
      - sensor.ev_available_charging_amps_three_phase
      - sensor.ev_available_charging_ma_single_phase
      - sensor.ev_available_charging_ma_three_phase
      - sensor.ev_debug_solar_values
      - sensor.ev_charging_debug_info
      # Control loop — triggers every 3 s while charging; history not useful
      - automation.ev_solar_dynamic_power_control
      # Charger current setpoint — written every 3 s by the control loop
      - number.peblar_ev_charger_charge_current_limit_ma

# ── Logbook exclusions ────────────────────────────────────────────────────────
# Suppress high-frequency EV control-loop entries from the HA logbook.
# The modbus domain exclusion is intentionally absent here — add it to
# configuration.yaml instead (install.sh checks for this):
#
#   logbook:
#     exclude:
#       domains:
#         - modbus   # suppresses Peblar Modbus register writes from the logbook
logbook:
  exclude:
    entities:
      # Control loop — triggers every 3 s while solar/battery_assist charging is active
      - automation.ev_solar_dynamic_power_control
      # Charger current setpoint — written every 3 s by the control loop
      - number.peblar_ev_charger_charge_current_limit_ma
