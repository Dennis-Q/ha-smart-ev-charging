# ev_notifications.yaml
#
# All EV notification logic in one place:
#   • ev_notify_dispatch          — central script; routes to the configured notify action
#   • ev_notify_test              — sends a test notification
#   • ev_notify_target_validation — persistent alert when the notify entity_id is invalid
#   • ev_charging_complete        — car reached its configured charge limit
#   • ev_charger_error            — charger entered an unexpected state
#   • ev_notify_charger_alert     — Peblar warning/error codes, and when they clear
#   • ev_notify_unexpected_charging        — charger drawing power with the switch off
#   • ev_notify_manual_override_reminder   — manual override left on
#   • ev_notify_unexpected_grid_charging / _resolved — solar session pulling from the grid
#   • ev_power_entity_unit_mismatch        — configured power entity reports kW, not W
#
# Helpers and template sensors these depend on stay with their domain:
#   input_boolean.ev_notifications_enabled, input_text.ev_notify_entity_id and
#   binary_sensor.ev_notify_target_invalid  → ev_generic.yaml
#   binary_sensor.ev_power_entity_unit_mismatch / ev_p1_unit_mismatch → ev_solar.yaml
# This mirrors the layout of hba_notifications.yaml in the sibling HBA project.

automation:
  # Surfaces a persistent notification when the notify-action helper is
  # empty / unknown / unavailable / not in 'domain.service' shape.
  # Fires on HA start, on state change of the validity binary_sensor, and
  # dismisses itself once the helper is populated correctly.
  - id: ev_notify_target_validation
    alias: "EV: Validate notify target"
    description: >-
      Creates a persistent notification when input_text.ev_notify_entity_id
      is empty or doesn't look like a valid notify action.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.ev_notify_target_invalid
        to: "on"
      - trigger: state
        entity_id: binary_sensor.ev_notify_target_invalid
        to: "off"
      - trigger: homeassistant
        event: start
    actions:
      - choose:
          - conditions: "{{ is_state('binary_sensor.ev_notify_target_invalid', 'on') }}"
            sequence:
              - action: persistent_notification.create
                data:
                  notification_id: ev_notify_target_invalid
                  title: "EV: Notify action not configured"
                  message: >-
                    The **Notify action** helper
                    (`input_text.ev_notify_entity_id`) is empty or doesn't
                    look like a valid action. EV-related notifications fall
                    back to persistent notifications.

                    Set it under **EV Charging → Advanced settings →
                    Notifications** to your preferred notify action, for
                    example `notify.mobile_app_dennis_mobile`.
        default:
          - action: persistent_notification.dismiss
            data:
              notification_id: ev_notify_target_invalid

