### Generic EV stuff

## Input helpers

input_number:
  ev_battery_capacity_kwh:
    name: "EV Battery Capacity"
    unit_of_measurement: "kWh"
    min: 50
    max: 100
    step: 1
    icon: mdi:battery-high

  ev_charger_max_power_kw:
    name: "EV Charger Maximum Power"
    unit_of_measurement: "kW"
    min: 6
    max: 11
    step: 1
    icon: mdi:lightning-bolt-circle

  ev_charging_efficiency_percent:
    name: "EV Charging Efficiency"
    unit_of_measurement: "%"
    min: 80
    max: 100
    step: 1
    icon: mdi:percent

  ev_power_buffer_watts:
    name: "EV Power Buffer"
    unit_of_measurement: "W"
    min: -7000 # was -2000 but changed for testing phases
    max: 2000
    step: 100
    icon: mdi:shield-check

  ev_charging_limit_force:
    name: "EV Charging Limit Force"
    unit_of_measurement: "%"
    min: 50
    max: 100
    step: 10
    icon: mdi:lightning-bolt-circle

  # Solar phase-switch thresholds — extracted from evcharging_solar.yaml so they
  # can be tuned without code edits. Defaults match what was hard-coded before.
  ev_solar_switch_to_3phase_threshold_w:
    name: "EV Solar: switch to 3-phase above"
    unit_of_measurement: "W"
    min: 3000
    max: 8000
    step: 50
    icon: mdi:current-ac
  ev_solar_switch_to_1phase_threshold_w:
    name: "EV Solar: switch back to 1-phase below"
    unit_of_measurement: "W"
    min: 2000
    max: 6000
    step: 50
    icon: mdi:current-ac
  ev_solar_min_charge_threshold_w:
    name: "EV Solar: stop charging below"
    unit_of_measurement: "W"
    min: 1000
    max: 2500
    step: 10
    icon: mdi:stop-circle-outline

input_boolean:
  ev_notifications_enabled:
    name: "EV Notifications Enabled"
    icon: mdi:bell

  ev_manual_override:
    name: "EV Manual Override"
    icon: mdi:hand-back-left

  ev_force_charge_once:
    name: "EV Force Charge (One-Time)"
    icon: mdi:lightning-bolt

  ev_force_charge_permanent:
    name: "EV Force Charge Permanent"
    icon: mdi:lightning-bolt-circle

  ev_charge_prefer_tariff_over_solar:
    name: "EV Charge prefer Tariff over Solar"
    icon: mdi:sun-clock-outline

input_datetime:
  ev_force_charge_timeout:
    name: "EV Force Charge Timeout"
    has_date: true
    has_time: true
    icon: mdi:timer-sand

input_text:
  ev_notify_entity_id:
    name: "EV Notify action"
    icon: mdi:bell-outline
    max: 100
    # e.g. notify.mobile_app_dennis_mobile — leave empty to fall back to
    # notify.persistent_notification

## Scripts

script:
  # Apply sensible starting values to every user-configurable EV helper.
  # Safe to re-run at any time. Does not touch internal state
  # (force-charge timeout, etc).
  ev_apply_defaults:
    alias: "EV: Apply defaults"
    description: >-
      Sets all user-configurable EV helpers to sensible starting values.
      Run once after a fresh install, or any time you want a known-good baseline.
    sequence:
      # Numbers
      - action: input_number.set_value
        target: { entity_id: input_number.ev_battery_capacity_kwh }
        data: { value: 60 }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_charger_max_power_kw }
        data: { value: 11 }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_charging_efficiency_percent }
        data: { value: 90 }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_power_buffer_watts }
        data: { value: 0 }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_charging_limit_force }
        data: { value: 80 }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_charging_limit_solar }
        data: { value: 100 }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_charging_limit_window }
        data: { value: 60 }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_window_charging_start_hour }
        data: { value: 22 }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_window_charging_end_hour }
        data: { value: 6 }
      # Solar phase-switch thresholds — match the previously hard-coded values
      - action: input_number.set_value
        target: { entity_id: input_number.ev_solar_switch_to_3phase_threshold_w }
        data: { value: 4800 }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_solar_switch_to_1phase_threshold_w }
        data: { value: 3500 }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_solar_min_charge_threshold_w }
        data: { value: 1380 }
      # Booleans — everything off so the user opts in deliberately
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.ev_manual_override
            - input_boolean.ev_force_charge_once
            - input_boolean.ev_force_charge_permanent
            - input_boolean.ev_charge_prefer_tariff_over_solar
            - input_boolean.ev_solar_charging
            - input_boolean.ev_window_charging
            - input_boolean.ev_dynamic_tariff_optimization
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ev_notifications_enabled
      # Note: input_text.ev_notify_entity_id is deliberately NOT reset.
      # Once a user has set their notify target, there's no scenario where
      # we'd want to wipe it back to empty.

  # Narrow reset for just the three solar phase-switch thresholds.
  # Used by the yellow warning banner and the small button under the
  # threshold sliders in Advanced settings.
  ev_apply_threshold_defaults:
    alias: "EV: Apply threshold defaults"
    description: >-
      Resets only the three solar phase-switch thresholds to their
      recommended values (4800 / 3500 / 1380 W). Leaves every other helper
      untouched.
    sequence:
      - action: input_number.set_value
        target: { entity_id: input_number.ev_solar_switch_to_3phase_threshold_w }
        data: { value: 4800 }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_solar_switch_to_1phase_threshold_w }
        data: { value: 3500 }
      - action: input_number.set_value
        target: { entity_id: input_number.ev_solar_min_charge_threshold_w }
        data: { value: 1380 }

## Templates & sensors

template:
  - binary_sensor:
      - name: "EV is Charging"
        unique_id: ev_is_charging
        state: "{{ is_state('sensor.peblar_ev_charger_state', 'charging') }}"
      - name: "EV is Connected"
        unique_id: ev_is_connected
        state: "{{ not is_state('sensor.peblar_ev_charger_state', 'no_ev_connected') and not is_state('sensor.peblar_ev_charger_state', 'unknown') and not is_state('sensor.peblar_ev_charger_state', 'unavailable') }}"
        # state: "{{ is_state('sensor.peblar_ev_charger_state', 'evcharging') or is_state('sensor.peblar_ev_charger_state', 'suspended') }}"

        #

      # 'on' when input_text.ev_notify_entity_id is empty, unknown, unavailable,
      # malformed, or points to a notify target that doesn't exist.
      #
      # Detection strategy:
      #   - Empty / unknown / unavailable / missing 'notify.' prefix → invalid
      #   - If the value is the legacy mobile_app service form
      #     ('notify.mobile_app_<device>'), derive the modern entity form
      #     ('notify.<device>') and check it exists in states.notify.
      #     Mobile_app integrations always register both a service and an
      #     entity for the same device, so the presence of the entity is a
      #     reliable proxy for service availability.
      #   - Otherwise (entity form already): check states.notify directly.
      #
      # Trade-off: `notify.persistent_notification` will be flagged invalid
      # because it is service-only. Users who want persistent notifications
      # should leave the helper empty — the action falls back to
      # notify.persistent_notification automatically.
      - name: "EV Notify Target Invalid"
        unique_id: ev_notify_target_invalid
        device_class: problem
        state: >-
          {%- set v = states('input_text.ev_notify_entity_id') | trim -%}
          {%- set notify_entities = states.notify | map(attribute='entity_id') | list -%}
          {%- if v in ['', 'unknown', 'unavailable'] -%}
            true
          {%- elif not v.startswith('notify.') or '.' not in v -%}
            true
          {%- else -%}
            {%- set svc = v[7:] -%}
            {%- if svc.startswith('mobile_app_') -%}
              {{ ('notify.' ~ svc[11:]) not in notify_entities }}
            {%- else -%}
              {{ v not in notify_entities }}
            {%- endif -%}
          {%- endif -%}
        attributes:
          notify_target: "{{ states('input_text.ev_notify_entity_id') }}"
          available_notify_entities: "{{ states.notify | map(attribute='entity_id') | list }}"
  - sensor:
      # Determine expected charging limit
      # Ideas:
      # - Maybe let Window win if battery percentage is not met?
      # - Or let Window win when in cheapest hours (not just window)
      # - Or let Window win when in cheapest hours (not just window) and less than 10% difference?
      # - Maybe include 'expected solar left' as well
      - name: "EV Expected Charging Limit"
        unique_id: ev_expected_charging_limit
        unit_of_measurement: "%"
        state: >
          {% set is_force_charging = is_state('input_boolean.ev_force_charge_once', 'on') or is_state('input_boolean.ev_force_charge_permanent', 'on')  %}
          {% set is_window_active = is_state('sensor.ev_charging_window_active', 'true') and is_state('input_boolean.ev_window_charging', 'on') %}
          {% set is_in_cheapest_window = is_state('sensor.ev_is_in_cheapest_window', 'true') %}
          {% set prefer_tariff_over_solar = is_state('input_boolean.ev_charge_prefer_tariff_over_solar', 'on') %}
          {% set solar_enabled = is_state('input_boolean.ev_solar_charging', 'on') %}
          {% set sun_up = is_state('sun.sun', 'above_horizon') %}

          {% if is_force_charging %}
            {{ states('input_number.ev_charging_limit_force') | int }}
          {% elif solar_enabled and prefer_tariff_over_solar and is_window_active and is_in_cheapest_window %} 
            {{ states('input_number.ev_charging_limit_window') | int }}
          {% elif solar_enabled and sun_up %}
            {{ states('input_number.ev_charging_limit_solar') | int }}
          {% elif is_window_active and tarif_optimization and is_in_cheapest_window %}
            {{ states('input_number.ev_charging_limit_window') | int }}
          {% elif is_window_active and not tarif_optimization  %}
            {{ states('input_number.ev_charging_limit_window') | int }}
          {% endif %}


      - name: "EV Charging Mode"
        unique_id: ev_charging_mode
        state: >
          {% set is_force_charging = is_state('input_boolean.ev_force_charge_once', 'on') or is_state('input_boolean.ev_force_charge_permanent', 'on')  %}
          {% set is_window_active = is_state('sensor.ev_charging_window_active', 'true') and is_state('input_boolean.ev_window_charging', 'on') %}
          {% set is_in_cheapest_window = is_state('sensor.ev_is_in_cheapest_window', 'true') %}
          {% set prefer_tariff_over_solar = is_state('input_boolean.ev_charge_prefer_tariff_over_solar', 'on') %}
          {% set tarif_optimization = is_state('input_boolean.ev_dynamic_tariff_optimization', 'on') %}
          {% set solar_enabled = is_state('input_boolean.ev_solar_charging', 'on') %}
          {% set sun_up = is_state('sun.sun', 'above_horizon') %}

          {% if is_force_charging %}
            force
          {% elif solar_enabled and prefer_tariff_over_solar and is_window_active and is_in_cheapest_window %} 
            cheapest
          {% elif solar_enabled and sun_up %}
            solar
          {% elif is_window_active and tarif_optimization and is_in_cheapest_window %}
            cheapest
          {% elif is_window_active and not tarif_optimization  %}
            window
          {% else %}
            none
          {% endif %}

      # Debug sensor - to be decided if this is really required.
      - name: "EV Debug Solar Values"
        unique_id: ev_debug_solar_values
        state: "OK"
        attributes:
          excess: "{{ states('sensor.ev_grid_excess_power') }} W"

## Automations

automation:
  # Surfaces a persistent notification when the notify-action helper is
  # empty / unknown / unavailable / not in 'domain.service' shape.
  # Fires on HA start, on state change of the validity binary_sensor, and
  # dismisses itself once the helper is populated correctly.
  - id: ev_notify_target_validation
    alias: "EV: Validate notify target"
    description: >-
      Creates a persistent notification when input_text.ev_notify_entity_id
      is empty or doesn't look like a valid notify action.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.ev_notify_target_invalid
        to: "on"
      - trigger: state
        entity_id: binary_sensor.ev_notify_target_invalid
        to: "off"
      - trigger: homeassistant
        event: start
    actions:
      - choose:
          - conditions: "{{ is_state('binary_sensor.ev_notify_target_invalid', 'on') }}"
            sequence:
              - action: persistent_notification.create
                data:
                  notification_id: ev_notify_target_invalid
                  title: "EV: Notify action not configured"
                  message: >-
                    The **Notify action** helper
                    (`input_text.ev_notify_entity_id`) is empty or doesn't
                    look like a valid action. EV-related notifications fall
                    back to persistent notifications.

                    Set it under **EV Charging → Advanced settings →
                    Notifications** to your preferred notify action, for
                    example `notify.mobile_app_dennis_mobile`.
        default:
          - action: persistent_notification.dismiss
            data:
              notification_id: ev_notify_target_invalid

