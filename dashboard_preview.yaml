  - title: Frank
    cards:
      - type: custom:apexcharts-card
        graph_span: 48h
        span:
          start: day
        now:
          show: true
          label: Now
        header:
          show: true
          title: Energy price per hour (€/kWh)
        series:
          - entity: sensor.frank_energie_prices_current_electricity_price_all_in
            show:
              legend_value: false
            stroke_width: 2
            float_precision: 3
            type: column
            opacity: 0.3
            color: "#03b2cb"
            data_generator: |
              return entity.attributes.prices.map((record, index) => {
                return [record.from, record.price];
              });
          - entity: sensor.average_electricity_price
            stroke_width: 2
            float_precision: 3
            type: column
            opacity: 1
            color: "#FF9800"
            data_generator: |
              return entity.attributes.prices.map((entry) => { 
              return [new Date(entry.time), entry.price];
              });
      - type: custom:apexcharts-card
        graph_span: 48h
        span:
          start: day
        now:
          show: true
          label: Now
        header:
          show: true
          title: Electriciteitsprijzen Vandaag (€/kwh)
        yaxis:
          - decimals: 2
        series:
          - entity: sensor.average_electricity_price
            stroke_width: 2
            float_precision: 3
            type: column
            opacity: 1
            color: ""
            data_generator: |
              return entity.attributes.prices.map((entry) => { 
              return [new Date(entry.time), entry.price];
              });
      - type: entities
        entities:
          - sensor.frank_energie_gasprices_current_gas_price_all_in
